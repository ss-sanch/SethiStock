name: Phase 3C Registry Audit

on:
  push:
    branches: [phase3c-registry-audit]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Audit live flagship KPI discovery
        run: |
          python - <<'PY'
          import json, urllib.request

          base='https://sethistock-api.onrender.com/api/drivers'
          tickers=['AAPL','MSFT','GOOGL','AMZN','META','NVDA','TSLA','NFLX','JPM','V']

          def get(path, timeout=240):
              with urllib.request.urlopen(base+path, timeout=timeout) as r:
                  return json.load(r)

          out={}
          for ticker in tickers:
              reg=get('/'+ticker)
              rows=[]
              for metric in reg['metrics']:
                  key=metric['key']
                  try:
                      result=get(f'/{ticker}/discover/{key}?filings=1&limit=8')
                      candidates=result.get('candidates') or []
                      top=[]
                      for c in candidates[:5]:
                          top.append({
                              'score':c.get('score'),
                              'concept':c.get('qualified_concept'),
                              'value':c.get('value'),
                              'period':[c.get('start'),c.get('end'),c.get('instant')],
                              'dimensions':c.get('dimensions'),
                              'form':c.get('form'),
                              'filing_date':c.get('filing_date'),
                              'accession':c.get('accession')
                          })
                      rows.append({'metric':key,'label':metric.get('label'),'value_kind':metric.get('value_kind'),'period_semantics':metric.get('period_semantics'),'source_priority':metric.get('source_priority'),'candidate_count':result.get('candidate_count'),'top':top})
                  except Exception as exc:
                      rows.append({'metric':key,'label':metric.get('label'),'error':repr(exc)})
              out[ticker]=rows
              print('AUDITED',ticker,len(rows), flush=True)
          print('PHASE3C_AUDIT='+json.dumps(out,separators=(',',':')))
          PY
