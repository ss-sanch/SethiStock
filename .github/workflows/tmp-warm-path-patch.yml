name: Temporary warm-path patch

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-warm-path-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Patch cached analysis warm path
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          text = p.read_text()

          old_telemetry = '''        if not is_peer and not getattr(_CACHE_REFRESH_CONTEXT, "suppress_telemetry", False):
            log_telemetry_event(project="SethiStock", action="ticker_search", ticker=raw_ticker)
        ticker = _resolve_ticker_cached(raw_ticker, background_tasks)
'''
          new_telemetry = '''        if not is_peer and not getattr(_CACHE_REFRESH_CONTEXT, "suppress_telemetry", False):
            telemetry_kwargs = {"project": "SethiStock", "action": "ticker_search", "ticker": raw_ticker}
            if background_tasks is not None:
                background_tasks.add_task(log_telemetry_event, **telemetry_kwargs)
            else:
                threading.Thread(target=log_telemetry_event, kwargs=telemetry_kwargs, daemon=True).start()
        ticker = _resolve_ticker_cached(raw_ticker, background_tasks)
'''
          assert old_telemetry in text, 'telemetry target not found'
          text = text.replace(old_telemetry, new_telemetry, 1)

          old_quote = '''                cached_analysis = copy.deepcopy(cached_analysis)
                try:
                    live_quote = get_stock_quote(ticker, background_tasks)
                    cached_analysis["ticker"] = str(live_quote.get("ticker", ticker)).upper()
                    cached_analysis["current_price"] = live_quote.get("current_price", cached_analysis.get("current_price", 0))
                    cached_analysis["change"] = live_quote.get("change", cached_analysis.get("change", 0))
                    cached_analysis["pct_change"] = live_quote.get("pct_change", cached_analysis.get("pct_change", 0))
                    if isinstance(cached_analysis.get("stats"), dict):
                        cached_analysis["stats"]["mkt_cap"] = live_quote.get("market_cap", cached_analysis["stats"].get("mkt_cap", "N/A"))
                except Exception:
                    pass
                if should_refresh_analysis:
'''
          new_quote = '''                cached_analysis = copy.deepcopy(cached_analysis)
                cached_analysis["analysis_cache_state"] = cache_state
                cached_analysis["analysis_cache_hit"] = True
                # Live price hydration is deliberately handled by /api/quote in parallel on
                # the SethiStock frontend. Do not turn a persistent analysis-cache hit into
                # another blocking Yahoo request before returning the heavy analysis payload.
                if should_refresh_analysis:
'''
          assert old_quote in text, 'cached quote hydration target not found'
          text = text.replace(old_quote, new_quote, 1)
          p.write_text(text)
          PY
          python -m py_compile app.py
      - name: Commit backend patch
        run: |
          git config user.name "ss-sanch"
          git config user.email "mlgsanchit@gmail.com"
          git add app.py
          git commit -m "Return cached stock analysis without blocking live quote"
          git push origin HEAD:${{ github.head_ref }}
