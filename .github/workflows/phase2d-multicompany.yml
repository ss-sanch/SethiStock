name: Phase 2D Multi-company Validation

on:
  push:
    branches: [phase2d-period-engine]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2d-period-engine
      - name: Validate different fiscal calendars
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request
          from fundamentals_periods import build_period_view

          base = 'https://sethistock-api.onrender.com'

          def fetch(ticker):
              url = f'{base}/api/sec/{ticker}/fundamentals/normalized?limit=1000'
              last = None
              for _ in range(6):
                  try:
                      with urllib.request.urlopen(url, timeout=180) as response:
                          return json.load(response)
                  except Exception as exc:
                      last = exc
                      time.sleep(5)
              raise AssertionError((ticker, last))

          summary = {}
          for ticker in ('MSFT', 'WMT', 'NVDA'):
              payload = fetch(ticker)
              normalized = payload['metrics']
              annual = build_period_view(normalized, period='annual', limit=40)
              quarterly = build_period_view(normalized, period='quarterly', limit=100)
              ttm = build_period_view(normalized, period='ttm', limit=100)

              assert annual['metrics']['revenue']['count'] >= 10, (ticker, annual['metrics']['revenue']['count'])
              assert annual['metrics']['operating_cash_flow']['count'] >= 8, (ticker, annual['metrics']['operating_cash_flow']['count'])
              assert quarterly['metrics']['revenue']['count'] >= 20, (ticker, quarterly['metrics']['revenue']['count'])
              assert quarterly['metrics']['operating_cash_flow']['count'] >= 20, (ticker, quarterly['metrics']['operating_cash_flow']['count'])
              assert ttm['metrics']['revenue']['count'] >= 10, (ticker, ttm['metrics']['revenue']['count'])

              # Reconcile multiple recent fiscal years for revenue and OCF.
              for metric_name in ('revenue', 'operating_cash_flow'):
                  annual_by_fy = {p['fiscal_year']: float(p['value']) for p in annual['metrics'][metric_name]['series']}
                  by_fy = {}
                  for point in quarterly['metrics'][metric_name]['series']:
                      by_fy.setdefault(point['fiscal_year'], []).append(point)
                  reconciled = 0
                  for fy, rows in by_fy.items():
                      if fy not in annual_by_fy or len(rows) != 4:
                          continue
                      qsum = sum(float(row['value']) for row in rows)
                      av = annual_by_fy[fy]
                      assert abs(qsum-av) <= max(1e-6, abs(av)*1e-9), (ticker, metric_name, fy, qsum, av)
                      reconciled += 1
                  assert reconciled >= 3, (ticker, metric_name, reconciled)

              summary[ticker] = {
                  'annual_revenue': annual['metrics']['revenue']['count'],
                  'quarterly_revenue': quarterly['metrics']['revenue']['count'],
                  'ttm_revenue': ttm['metrics']['revenue']['count'],
                  'calendar': annual['fiscal_calendar'],
              }

          # Walmart's January fiscal year is the key non-calendar-year regression.
          assert summary['WMT']['calendar']['latest_completed_fiscal_year'] >= 2026, summary['WMT']
          print('PHASE2D_MULTICOMPANY=' + json.dumps(summary, sort_keys=True))
          print('PHASE2D_MULTICOMPANY_OK')
          PY
