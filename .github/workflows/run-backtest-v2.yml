name: Run Backtest 2.0 migration
on:
  push:
    branches:
      - feature/backtest-v2
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/backtest-v2
      - run: python scripts/apply_backtest_v2.py
      - run: python -m py_compile app.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet && exit 0
          git commit -m "Add Backtest 2.0 analytics [skip ci]"
          git push origin HEAD:feature/backtest-v2
