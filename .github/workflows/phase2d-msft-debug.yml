name: Phase 2D MSFT Debug

on:
  push:
    branches: [phase2d-period-engine]

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2d-period-engine
      - name: Apply pending reconciliation patch
        run: python .phase2d_reconcile_patch.py
      - name: Trace Microsoft FY2016
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from fundamentals_periods import build_period_view, infer_fiscal_periods, infer_quarter_ends

          with urllib.request.urlopen('https://sethistock-api.onrender.com/api/sec/MSFT/fundamentals/normalized?limit=1000', timeout=180) as r:
              payload = json.load(r)
          normalized = payload['metrics']
          periods = infer_fiscal_periods(normalized)
          target = next(p for p in periods if p['fiscal_year'] == 2016)
          print('FY2016_PERIOD', target['start'], target['end'], target['anchor'])
          print('FY2016_QUARTER_ENDS', infer_quarter_ends(normalized, target))

          annual = build_period_view(normalized, period='annual', metrics=['revenue'], limit=100)
          quarterly = build_period_view(normalized, period='quarterly', metrics=['revenue'], limit=200)
          annual_point = next(p for p in annual['metrics']['revenue']['series'] if p['fiscal_year'] == 2016)
          quarter_points = [p for p in quarterly['metrics']['revenue']['series'] if p['fiscal_year'] == 2016]
          print('ANNUAL_POINT=' + json.dumps(annual_point, sort_keys=True))
          for point in quarter_points:
              print('QUARTER_POINT=' + json.dumps(point, sort_keys=True))
          print('QSUM=', sum(float(p['value']) for p in quarter_points))

          raw = []
          for row in normalized['revenue']['observations']:
              start = row.get('start') or ''
              end = row.get('end') or ''
              if '2015-06-01' <= end <= '2016-08-15':
                  raw.append({
                      'value': row.get('value'), 'start': start, 'end': end,
                      'duration_days': row.get('duration_days'), 'filed': row.get('filed'),
                      'form': row.get('form'), 'fp': row.get('fp'), 'fy': row.get('fy'),
                      'frame': row.get('frame'), 'accn': row.get('accn'),
                      'concept': row.get('concept'), 'concept_rank': row.get('concept_rank')
                  })
          for row in sorted(raw, key=lambda x: (x['end'], x['start'], x['duration_days'] or -1, x['filed'] or '')):
              print('RAW=' + json.dumps(row, sort_keys=True))
          PY
