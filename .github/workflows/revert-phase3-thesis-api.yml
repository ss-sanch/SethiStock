name: Revert unused Phase 3 thesis backend

on:
  push:
    branches: [revert-phase3-thesis-api]

permissions:
  contents: write

jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert-phase3-thesis-api
          fetch-depth: 0
      - name: Restore pre-thesis backend
        shell: bash
        run: |
          git checkout 66a0f9dead7bb8d3b9a52b81a0901dd75861caf0 -- sethiportfolio.py
          git rm -f sql/sethiportfolio_3a_thesis_tracking.sql
      - name: Validate backend
        shell: bash
        run: |
          python -m py_compile sethiportfolio.py
          ! grep -q 'def get_theses' sethiportfolio.py
          ! grep -q 'portfolio_thesis_updates' sethiportfolio.py
          test ! -f sql/sethiportfolio_3a_thesis_tracking.sql
      - name: Commit revert
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Already reverted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove unused thesis tracking backend'
          git push origin HEAD:revert-phase3-thesis-api
