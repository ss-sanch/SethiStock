name: Phase 2B Live Mapping Audit

on:
  push:
    branches:
      - phase2b-fundamentals-normalisation

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Probe cost-of-revenue concepts
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.parse
          import urllib.request

          base = 'https://sethistock-api.onrender.com'
          candidates = [
              'CostOfRevenue',
              'CostOfGoodsAndServicesSold',
              'CostOfGoodsSold',
              'CostOfServices',
              'CostOfSales',
          ]

          def get(path):
              try:
                  with urllib.request.urlopen(base + path, timeout=120) as response:
                      return response.status, json.load(response)
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode('utf-8', errors='replace')
                  try:
                      return exc.code, json.loads(body)
                  except Exception:
                      return exc.code, {'raw': body[:300]}

          for ticker in ['AAPL', 'MSFT', 'GOOGL']:
              found = []
              for concept in candidates:
                  q = urllib.parse.urlencode({'taxonomy': 'us-gaap', 'concept': concept, 'limit': 1})
                  status, payload = get(f'/api/sec/{ticker}/concept?' + q)
                  if status == 200:
                      found.append((concept, list((payload.get('units') or {}).keys()), payload.get('label')))
                  elif status != 404:
                      raise AssertionError((ticker, concept, status, payload))
              q = urllib.parse.urlencode({'taxonomy': 'us-gaap', 'q': 'cost of revenue', 'limit': 100})
              status, search = get(f'/api/sec/{ticker}/concepts?' + q)
              assert status == 200, (ticker, status, search)
              named = [item.get('concept') for item in search.get('concepts', [])]
              print(ticker + '_COST_CANDIDATES=' + json.dumps(found))
              print(ticker + '_COST_SEARCH=' + json.dumps(named))
          print('PHASE2B_COST_AUDIT_OK')
          PY
