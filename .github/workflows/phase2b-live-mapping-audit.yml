name: Phase 2B Live Mapping Audit

on:
  push:
    branches:
      - phase2b-fundamentals-normalisation

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Audit real SEC concept availability
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.parse
          import urllib.request

          base = 'https://sethistock-api.onrender.com'
          concepts = [
              ('us-gaap', 'RevenueFromContractWithCustomerExcludingAssessedTax'),
              ('us-gaap', 'Revenues'),
              ('us-gaap', 'SalesRevenueNet'),
              ('us-gaap', 'NetIncomeLoss'),
              ('us-gaap', 'ProfitLoss'),
              ('us-gaap', 'NetCashProvidedByUsedInOperatingActivities'),
              ('us-gaap', 'PaymentsToAcquirePropertyPlantAndEquipment'),
              ('us-gaap', 'CashAndCashEquivalentsAtCarryingValue'),
              ('us-gaap', 'CashCashEquivalentsRestrictedCashAndRestrictedCashEquivalents'),
              ('dei', 'EntityCommonStockSharesOutstanding'),
              ('us-gaap', 'CommonStockSharesOutstanding'),
              ('us-gaap', 'GrossProfit'),
              ('us-gaap', 'OperatingIncomeLoss'),
              ('us-gaap', 'LongTermDebtCurrent'),
              ('us-gaap', 'LongTermDebtAndFinanceLeaseObligationsCurrent'),
              ('us-gaap', 'LongTermDebtNoncurrent'),
              ('us-gaap', 'LongTermDebtAndFinanceLeaseObligationsNoncurrent'),
              ('us-gaap', 'ShortTermBorrowings'),
              ('us-gaap', 'ShortTermDebt'),
              ('us-gaap', 'CommercialPaper'),
          ]

          def get(path):
              try:
                  with urllib.request.urlopen(base + path, timeout=120) as response:
                      return response.status, json.load(response)
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode('utf-8', errors='replace')
                  try:
                      return exc.code, json.loads(body)
                  except Exception:
                      return exc.code, {'raw': body[:200]}

          for ticker in ['AAPL', 'MSFT', 'GOOGL']:
              available = []
              missing = []
              for taxonomy, concept in concepts:
                  q = urllib.parse.urlencode({'taxonomy': taxonomy, 'concept': concept, 'limit': 1})
                  status, payload = get(f'/api/sec/{ticker}/concept?' + q)
                  if status == 200:
                      unit_counts = {unit: len(rows) for unit, rows in (payload.get('units') or {}).items()}
                      available.append((taxonomy, concept, unit_counts))
                  elif status == 404:
                      missing.append((taxonomy, concept))
                  else:
                      raise AssertionError((ticker, taxonomy, concept, status, payload))
              print(ticker + '_AVAILABLE=' + json.dumps(available))
              print(ticker + '_MISSING=' + json.dumps(missing))
          print('PHASE2B_LIVE_MAPPING_AUDIT_OK')
          PY
