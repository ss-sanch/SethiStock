name: Phase 1C Backend

on:
  push:
    branches:
      - phase1c-progressive-loading

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1c-progressive-loading

      - name: Add lightweight quote endpoint
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          path = Path('app.py')
          text = path.read_text(encoding='utf-8')
          marker = '@app.get("/api/peers")\ndef get_peer_snapshots(tickers: str):'
          if marker not in text:
              raise SystemExit('Peer endpoint marker not found.')

          block = textwrap.dedent('''
          def _default_peers_for_ticker(symbol: str):
              ticker_peers = {
                  'AAPL': ['MSFT', 'GOOGL', 'META'], 'MSFT': ['AAPL', 'GOOGL', 'AMZN'], 'TSLA': ['F', 'GM', 'RIVN'],
                  'NVDA': ['AMD', 'INTC', 'TSM'], 'AMZN': ['WMT', 'BABA', 'EBAY'], 'META': ['GOOGL', 'SNAP', 'PINS'],
                  'GOOGL': ['META', 'MSFT', 'AMZN'], 'NFLX': ['DIS', 'WBD', 'AMZN'], 'JPM': ['BAC', 'WFC', 'C'],
                  'V': ['MA', 'AXP', 'PYPL'], 'AMD': ['NVDA', 'INTC', 'QCOM']
              }
              return ticker_peers.get(symbol.upper(), ['SPY', 'QQQ', 'DIA'])


          @app.get("/api/quote/{raw_ticker}")
          def get_stock_quote(raw_ticker: str):
              """Fast above-the-fold quote used while the full SethiStock analysis loads."""
              try:
                  ticker = resolve_ticker(raw_ticker).upper()
                  stock = yf.Ticker(ticker)

                  fast = None
                  try:
                      fast = stock.fast_info
                  except Exception:
                      pass

                  current_price = _peer_safe_float(getattr(fast, "last_price", None) if fast is not None else None)
                  previous_close = _peer_safe_float(getattr(fast, "previous_close", None) if fast is not None else None)
                  market_cap = _peer_safe_float(getattr(fast, "market_cap", None) if fast is not None else None)

                  if current_price is None or previous_close is None:
                      try:
                          hist = stock.history(period="5d", interval="1d")
                          if hist is not None and not hist.empty:
                              current_price = current_price if current_price is not None else _peer_safe_float(hist['Close'].iloc[-1])
                              if previous_close is None and len(hist) >= 2:
                                  previous_close = _peer_safe_float(hist['Close'].iloc[-2])
                      except Exception:
                          pass

                  current_price = current_price or 0.0
                  previous_close = previous_close or current_price
                  change = current_price - previous_close
                  pct_change = (change / previous_close * 100.0) if previous_close else 0.0

                  return {
                      "ticker": ticker,
                      "current_price": round(current_price, 2),
                      "change": round(change, 2),
                      "pct_change": round(pct_change, 2),
                      "market_cap": _peer_format_market_cap(market_cap),
                      "peers": _default_peers_for_ticker(ticker),
                  }
              except Exception as exc:
                  raise HTTPException(status_code=500, detail=str(exc))


          ''').lstrip()
          text = text.replace(marker, block + marker, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate backend syntax
        run: |
          python -m py_compile app.py
          python - <<'PY'
          from pathlib import Path
          text = Path('app.py').read_text(encoding='utf-8')
          assert '@app.get("/api/quote/{raw_ticker}")' in text
          segment = text[text.index('@app.get("/api/quote/{raw_ticker}")'):text.index('@app.get("/api/peers")')]
          assert 'stock.financials' not in segment
          assert 'stock.cashflow' not in segment
          print('Quote endpoint is isolated from full financial-statement fetching.')
          PY

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Smoke test quote endpoint
        env:
          ADMIN_SECRET: test
        run: |
          python - <<'PY'
          import app
          data = app.get_stock_quote('AAPL')
          assert data['ticker'] == 'AAPL'
          assert isinstance(data['current_price'], (int, float)) and data['current_price'] > 0
          assert isinstance(data['change'], (int, float))
          assert isinstance(data['pct_change'], (int, float))
          assert isinstance(data['peers'], list) and len(data['peers']) == 3
          print('Quote smoke test passed:', data)
          PY

      - name: Commit backend change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet && exit 0
          git commit -m "Add lightweight quote endpoint for progressive loading"
          git push
