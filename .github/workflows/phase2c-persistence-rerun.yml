name: Phase 2C Persistence Rerun

on:
  push:
    branches: [phase2c-persistent-fundamentals]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2c-persistent-fundamentals
      - run: python .phase2c_patch.py
      - run: pip install -q -r requirements.txt
      - name: Validate Phase 2C
        run: |
          python -m py_compile fundamentals_store.py fundamentals_normalizer.py sec_fundamentals.py app.py
          python - <<'PY'
          from datetime import datetime, timezone, timedelta
          from fastapi import FastAPI, HTTPException
          from fastapi.testclient import TestClient
          import fundamentals_store as store
          import sec_fundamentals as sec

          def obs(value, concept='Revenues'):
              return {'value': value, 'unit': 'USD', 'start': '2024-01-01', 'end': '2024-12-31',
                      'filed': '2025-02-01', 'fy': 2024, 'fp': 'FY', 'form': '10-K', 'frame': 'CY2024',
                      'accn': 'x', 'taxonomy': 'us-gaap', 'concept': concept, 'concept_rank': 0,
                      'duration_days': 365, 'derived': False, 'source': 'SEC EDGAR Company Facts'}
          normalized = {
              'revenue': {'metric': 'revenue', 'label': 'Revenue', 'kind': 'flow', 'unit': 'USD', 'derived': False,
                          'count': 1, 'coverage': {}, 'observations': [obs(100)]},
              'net_income': {'metric': 'net_income', 'label': 'Net Income', 'kind': 'flow', 'unit': 'USD', 'derived': False,
                             'count': 1, 'coverage': {}, 'observations': [obs(20, 'NetIncomeLoss')]},
          }
          identity = {'ticker': 'FIX', 'cik': 123456, 'cik_padded': '0000123456', 'title': 'Fixture Corp'}
          rows, manifest, stats = store._flatten_snapshot(identity=identity, normalized=normalized,
              schema_version='2b-v1', sync_id='11111111-1111-1111-1111-111111111111')
          assert len(rows) == 2 and stats['observation_count'] == 2
          assert rows[0]['source_concepts'] == ['us-gaap:Revenues']

          calls = []
          original_request, original_configured = store._request, store.is_configured
          store.is_configured = lambda: True
          class Response:
              def json(self): return []
          def fake_request(method, table, **kwargs):
              calls.append((method, table, kwargs)); return Response()
          store._request = fake_request
          result = store.persist_snapshot(identity=identity, entity_name='Fixture Corp', normalized=normalized,
                                          schema_version='2b-v1', ttl_seconds=86400)
          obs_post = next(i for i, c in enumerate(calls) if c[0] == 'POST' and c[1] == store.OBSERVATIONS_TABLE)
          sync_post = next(i for i, c in enumerate(calls) if c[0] == 'POST' and c[1] == store.SYNCS_TABLE)
          assert obs_post < sync_post and result['observation_count'] == 2
          store._request, store.is_configured = original_request, original_configured

          now = datetime.now(timezone.utc)
          store.get_sync_state = lambda ticker, schema_version: {
              'ticker': 'FIX', 'schema_version': '2b-v1', 'cik': 123456, 'title': 'Fixture Corp',
              'entity_name': 'Fixture Corp', 'active_sync_id': '11111111-1111-1111-1111-111111111111',
              'source': 'SEC EDGAR Company Facts', 'metric_manifest': manifest, 'observation_count': 1,
              'source_latest_filed': '2025-02-01', 'synced_at': now.isoformat(),
              'expires_at': (now + timedelta(hours=1)).isoformat()}
          store._read_active_rows = lambda sync_id, metrics=None: [{
              'metric': 'revenue', 'kind': 'flow', 'unit': 'USD', 'value': 100,
              'period_start': '2024-01-01', 'period_end': '2024-12-31', 'filed': '2025-02-01',
              'fy': 2024, 'fp': 'FY', 'form': '10-K', 'frame': 'CY2024', 'accn': 'x',
              'taxonomy': 'us-gaap', 'concept': 'Revenues', 'concept_rank': 0, 'duration_days': 365,
              'derived': False, 'formula': None, 'components': None, 'source_concepts': ['us-gaap:Revenues'],
              'source': 'SEC EDGAR Company Facts'}]
          rebuilt = store.load_snapshot(ticker='FIX', schema_version='2b-v1', metric_order=['revenue'], metrics=['revenue'], limit=10)
          assert rebuilt['fresh'] is True and rebuilt['metrics']['revenue']['count'] == 1

          app = FastAPI(); app.include_router(sec.router); client = TestClient(app)
          sec.fundamentals_store.is_configured = lambda: True
          fresh = {**rebuilt, 'metric_order': ['revenue'], 'fresh': True}
          sec.fundamentals_store.load_snapshot = lambda **kwargs: fresh
          sec.get_company_facts = lambda *a, **k: (_ for _ in ()).throw(AssertionError('SEC should not be called'))
          response = client.get('/api/sec/FIX/fundamentals/normalized?metrics=revenue')
          assert response.status_code == 200 and response.json()['storage']['backend'] == 'supabase'

          stale = {**fresh, 'fresh': False, 'storage': {**fresh['storage'], 'state': 'stale'}}
          sec.fundamentals_store.load_snapshot = lambda **kwargs: stale
          sec.get_company_facts = lambda *a, **k: (_ for _ in ()).throw(HTTPException(status_code=502, detail='down'))
          response = client.get('/api/sec/FIX/fundamentals/normalized?metrics=revenue')
          assert response.status_code == 200 and response.json()['storage']['state'] == 'stale_fallback'
          assert client.get('/api/sec/FIX/fundamentals/normalized?metrics=made_up').status_code == 400
          print('PHASE2C_PERSISTENCE_OK')
          PY
      - name: Commit Phase 2C route
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sec_fundamentals.py
          git commit -m "Wire Phase 2C persistent fundamentals API" || true
          git pull --rebase origin phase2c-persistent-fundamentals
          git push
