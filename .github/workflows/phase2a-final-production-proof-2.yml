name: Phase 2A Final Production Proof 2

on:
  push:
    branches:
      - phase2a-final-production-proof-2

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Probe SEC concept payload sizes and issuers
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.parse
          import urllib.request

          base = 'https://sethistock-api.onrender.com'

          def get(path, timeout=120):
              try:
                  with urllib.request.urlopen(base + path, timeout=timeout) as response:
                      return response.status, json.load(response)
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode('utf-8', errors='replace')
                  try:
                      payload = json.loads(body)
                  except Exception:
                      payload = {'raw': body[:1000]}
                  return exc.code, payload

          status, cfg = get('/api/sec/status', 60)
          print('SEC_STATUS=' + str(status) + ':' + json.dumps(cfg, sort_keys=True))
          assert status == 200 and cfg.get('configured') is True

          for limit in [10, 25, 50, 100, 250, 500]:
              q = urllib.parse.urlencode({'concept': 'Assets', 'limit': limit})
              status, assets = get('/api/sec/AAPL/concept?' + q)
              usd = (assets.get('units') or {}).get('USD') or [] if isinstance(assets, dict) else []
              print(f'AAPL_ASSETS_LIMIT_{limit}=' + str(status) + ':rows=' + str(len(usd)) + ':payload=' + json.dumps(assets, sort_keys=True)[:400])

          for ticker, expected_cik in [('MSFT', 789019), ('GOOGL', 1652044)]:
              status, company = get(f'/api/sec/{ticker}/overview')
              print(f'{ticker}_OVERVIEW_STATUS=' + str(status))
              print(f'{ticker}_OVERVIEW=' + json.dumps(company, sort_keys=True)[:2500])
              assert status == 200, (ticker, status, company)
              assert company.get('cik') == expected_cik, company
              assert any(x.get('taxonomy') == 'us-gaap' for x in company.get('taxonomies', [])), company

          print('PHASE2A_PROBE_OK')
          PY
