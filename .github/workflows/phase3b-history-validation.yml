name: Phase 3B History Validation

on:
  push:
    branches: [phase3b-historical-kpi-series]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase3b-historical-kpi-series

      - name: Install parser dependencies
        run: pip install fastapi beautifulsoup4 requests

      - name: Apply history route patch
        run: python .phase3b_history_patch.py

      - name: Validate history engine
        run: |
          python -m py_compile company_driver_history.py company_driver_filings.py company_drivers.py
          python - <<'PY'
          import company_driver_history as h

          metric = {
              'key':'aws_revenue','label':'AWS Revenue','value_kind':'flow',
              'period_semantics':'duration','expected_frequency':'quarterly'
          }
          dims=[{'dimension':'us-gaap:StatementBusinessSegmentsAxis','member':'amzn:AmazonWebServicesSegmentMember'}]
          def fact(start,end,value,filed,form='10-Q',accession='x'):
              return {
                  'taxonomy':'us-gaap','concept':'RevenueFromContractWithCustomerExcludingAssessedTax',
                  'qualified_concept':'us-gaap:RevenueFromContractWithCustomerExcludingAssessedTax',
                  'numeric':True,'value':value,'period_semantics':'duration','start':start,'end':end,
                  'instant':None,'dimensions':dims,'unit_ref':'usd','filing_date':filed,'report_date':end,
                  'form':form,'accession':accession,'source_url':'https://www.sec.gov/test','score':27,
              }

          rule=h.get_verified_rule('AMZN','aws_revenue')
          assert rule
          good=fact('2025-01-01','2025-03-31',10,'2025-04-30','10-Q','old')
          assert h._fact_matches_rule(good,metric,rule)
          bad={**good,'concept':'SegmentExpenditureAdditionToLongLivedAssets','qualified_concept':'us-gaap:SegmentExpenditureAdditionToLongLivedAssets'}
          assert not h._fact_matches_rule(bad,metric,rule)
          assert h.classify_period(good)=='quarter'

          newer=fact('2025-01-01','2025-03-31',11,'2026-02-01','10-K','new')
          ytd=fact('2025-01-01','2025-09-30',70,'2025-10-30','10-Q','9m')
          annual=fact('2025-01-01','2025-12-31',100,'2026-02-01','10-K','fy')
          reported=h._dedupe_reported_facts([good,newer,ytd,annual])
          q1=[x for x in reported if x['period_type']=='quarter'][0]
          assert q1['value']==11 and q1['accession']=='new'
          q4=h._derive_q4(reported,metric)
          assert len(q4)==1
          assert q4[0]['value']==30
          assert q4[0]['start']=='2025-10-01' and q4[0]['end']=='2025-12-31'
          assert q4[0]['derived'] is True
          assert q4[0]['derivation']['formula']=='FY - 9M'

          schema=h.history_schema()
          assert schema['version']=='3b-history-v1'
          assert len(schema['verified_rules'])==3
          print('PHASE3B_HISTORY_ENGINE_OK')
          PY

      - name: Validate API route contract
        run: |
          python - <<'PY'
          import company_drivers
          routes={route.path for route in company_drivers.router.routes}
          assert '/api/drivers/history/schema' in routes
          assert '/api/drivers/{ticker}/history/{metric_key}' in routes
          print('PHASE3B_HISTORY_ROUTES_OK')
          PY

      - name: Commit permanent Phase 3B changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add company_driver_history.py company_drivers.py
          git commit -m "Add verified Company Driver historical series" || true
          git pull --rebase origin phase3b-historical-kpi-series
          git push
