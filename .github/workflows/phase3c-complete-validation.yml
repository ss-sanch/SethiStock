name: Phase 3C Complete Validation

on:
  push:
    branches: [phase3c-flagship-rollout]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase3c-flagship-rollout
      - name: Install dependencies
        run: pip install beautifulsoup4 requests fastapi
      - name: Apply completion patch
        run: python .phase3c_complete_patch.py
      - name: Validate source modes
        run: |
          python -m py_compile company_driver_history.py company_driver_tables.py company_drivers.py
          python - <<'PY'
          from bs4 import BeautifulSoup
          import company_driver_history as h
          import company_driver_tables as t

          # Direct + historical direct rules.
          assert h.metric_coverage('AAPL','services_revenue')['state']=='verified_sec_history'
          assert h.metric_coverage('NVDA','gaming_revenue')['state']=='verified_sec_historical'
          assert h.metric_coverage('NVDA','automotive_revenue')['state']=='verified_sec_historical'

          # Derived ratios.
          assert h.metric_coverage('NVDA','gross_margin')['state']=='verified_derived_sec_history'
          assert h.metric_coverage('TSLA','automotive_gross_margin')['state']=='verified_derived_sec_history'

          # Verified table histories.
          assert h.metric_coverage('V','processed_transactions')['verified'] is True
          assert h.metric_coverage('JPM','cet1_ratio')['verified'] is True
          assert h.metric_coverage('NFLX','paid_memberships')['verified'] is True

          # Safety states remain explicit.
          assert h.metric_coverage('TSLA','vehicle_deliveries')['state']=='official_ir_required'
          assert h.metric_coverage('V','payments_credentials')['state']=='official_ir_required'

          # Synthetic Visa row parser tolerates leading blank cells.
          visa_html='''<table><tr><td></td><td>Three Months Ended June 30, 2026</td></tr><tr><td></td><td>Visa processed transactions</td><td>71,662</td><td>65,443</td><td>10%</td></tr></table>'''
          filing={'form':'10-Q','filing_date':'2026-07-31','report_date':'2026-06-30','accession':'v','source_url':'https://sec/v'}
          rows=t._visa_processed_transactions(BeautifulSoup(visa_html,'html.parser'),filing)
          assert len(rows)==1 and rows[0]['value']==71662000000.0

          # Synthetic JPM selected-ratio parser.
          jpm_html='''<table><tr><td>Standardized selected ratios</td></tr><tr><td></td><td>Common equity Tier 1 (CET1) capital ratio - Standardized</td><td>14.2%</td><td>14.3%</td></tr></table>'''
          filing2={'form':'10-Q','filing_date':'2026-07-15','report_date':'2026-06-30','accession':'j','source_url':'https://sec/j'}
          rows=t._jpm_cet1_ratio(BeautifulSoup(jpm_html,'html.parser'),filing2)
          assert len(rows)==1 and rows[0]['value']==14.2

          # Synthetic Netflix four-region aggregate.
          html='''
          <p>United States and Canada (UCAN)</p><table><tr><td>Paid memberships at end of period</td><td>89,625</td></tr></table>
          <p>Europe, Middle East, and Africa (EMEA)</p><table><tr><td>Paid memberships at end of period</td><td>101,133</td></tr></table>
          <p>Latin America (LATAM)</p><table><tr><td>Paid memberships at end of period</td><td>53,327</td></tr></table>
          <p>Asia-Pacific (APAC)</p><table><tr><td>Paid memberships at end of period</td><td>57,541</td></tr></table>
          '''
          filing3={'form':'10-K','filing_date':'2025-01-24','report_date':'2024-12-31','accession':'n','source_url':'https://sec/n'}
          rows=t._netflix_paid_memberships(BeautifulSoup(html,'html.parser'),filing3)
          assert len(rows)==1 and rows[0]['value']==301626000.0

          print('PHASE3C_SOURCE_MODES_OK')
          PY
      - name: Validate derived ratio engine
        run: |
          python - <<'PY'
          import company_driver_history as h
          import company_driver_filings as f

          filing={'form':'10-Q','filing_date':'2026-07-31','report_date':'2026-06-30','accession':'x','source_url':'https://sec/x','is_inline_xbrl':True}
          facts=[
            {'numeric':True,'value':75.0,'period_semantics':'duration','taxonomy':'us-gaap','concept':'GrossProfit','qualified_concept':'us-gaap:GrossProfit','dimensions':[],'start':'2026-04-01','end':'2026-06-30','instant':None,'unit_ref':'usd',**{k:filing[k] for k in ['form','filing_date','report_date','accession','source_url']}},
            {'numeric':True,'value':100.0,'period_semantics':'duration','taxonomy':'us-gaap','concept':'Revenues','qualified_concept':'us-gaap:Revenues','dimensions':[],'start':'2026-04-01','end':'2026-06-30','instant':None,'unit_ref':'usd',**{k:filing[k] for k in ['form','filing_date','report_date','accession','source_url']}},
          ]
          f.recent_periodic_filings=lambda *a,**k:[filing]
          f.get_parsed_filing=lambda filing:{'facts':facts}
          out=h._build_derived_ratio_history('NVDA',{'key':'gross_margin','label':'Gross Margin'},h.DERIVED_RATIO_RULES[('NVDA','gross_margin')],1,'quarterly',10)
          assert out['observation_count']==1
          assert abs(out['observations'][0]['value']-75.0)<1e-9
          assert out['observations'][0]['derivation']['numerator']['concept']=='us-gaap:GrossProfit'
          print('PHASE3C_DERIVED_RATIO_OK')
          PY
      - name: Validate coverage route
        run: |
          python - <<'PY'
          import company_drivers
          routes={r.path for r in company_drivers.router.routes}
          assert '/api/drivers/{ticker}/coverage' in routes
          print('PHASE3C_ROUTE_OK')
          PY
      - name: Commit permanent completion changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add company_driver_history.py company_driver_tables.py company_drivers.py
          git commit -m "Complete flagship Company Drivers rollout" || true
          git pull --rebase origin phase3c-flagship-rollout
          git push
