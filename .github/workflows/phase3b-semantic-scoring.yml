name: Phase 3B Semantic Scoring

on:
  push:
    branches: [fix-phase3b-semantic-scoring]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-phase3b-semantic-scoring
      - name: Install parser dependencies
        run: pip install beautifulsoup4 requests fastapi
      - name: Apply semantic scoring fix
        run: python .phase3b_semantic_patch.py
      - name: Validate semantic ranking
        run: |
          python -m py_compile company_driver_filings.py
          python - <<'PY'
          import company_driver_filings as f

          metric = {'key':'aws_revenue','label':'AWS Revenue','category':'cloud','period_semantics':'duration'}
          dims = [{'dimension':'us-gaap:StatementBusinessSegmentsAxis','member':'amzn:AmazonWebServicesSegmentMember'}]
          base = {'taxonomy':'us-gaap','period_semantics':'duration','numeric':True,'dimensions':dims}
          revenue = {**base, 'concept':'RevenueFromContractWithCustomerExcludingAssessedTax', 'qualified_concept':'us-gaap:RevenueFromContractWithCustomerExcludingAssessedTax'}
          capex = {**base, 'concept':'SegmentExpenditureAdditionToLongLivedAssets', 'qualified_concept':'us-gaap:SegmentExpenditureAdditionToLongLivedAssets'}
          assert f.score_fact_for_metric(revenue, metric) > f.score_fact_for_metric(capex, metric)
          assert f._accounting_semantic_score('us-gaap revenuefromcontractwithcustomer', metric) == 12
          assert f._accounting_semantic_score('us-gaap segmentexpenditureadditiontolonglivedassets', metric) == -12

          op_metric = {'key':'aws_operating_income','label':'AWS Operating Income','category':'cloud','period_semantics':'duration'}
          op_income = {**base, 'concept':'OperatingIncomeLoss', 'qualified_concept':'us-gaap:OperatingIncomeLoss'}
          revenue_fact = {**base, 'concept':'Revenues', 'qualified_concept':'us-gaap:Revenues'}
          assert f.score_fact_for_metric(op_income, op_metric) > f.score_fact_for_metric(revenue_fact, op_metric)
          print('PHASE3B_SEMANTIC_OK')
          PY
      - name: Commit semantic scoring fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add company_driver_filings.py
          git commit -m "Prioritise KPI accounting semantics in discovery" || true
          git pull --rebase origin fix-phase3b-semantic-scoring
          git push
