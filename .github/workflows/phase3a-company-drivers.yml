name: Phase 3A Company Drivers

on:
  push:
    branches: [phase3a-company-driver-registry]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase3a-company-driver-registry

      - name: Apply app wiring
        run: python .phase3a_patch.py

      - name: Install focused test dependencies
        run: python -m pip install fastapi==0.111.0 pytest

      - name: Validate Phase 3A registry
        run: |
          python -m py_compile company_drivers.py
          pytest -q tests/test_company_drivers.py
          python - <<'PY'
          from pathlib import Path
          data = Path('app.py').read_bytes()
          assert b'import company_drivers\r\n' in data
          assert b'app.include_router(company_drivers.router)\r\n' in data
          assert data.count(b'\n') == data.count(b'\r\n')
          print('PHASE3A_APP_CRLF_OK')
          PY

      - name: Smoke FastAPI routes
        run: |
          python - <<'PY'
          from fastapi import FastAPI
          from fastapi.testclient import TestClient
          import company_drivers

          app = FastAPI()
          app.include_router(company_drivers.router)
          client = TestClient(app)

          schema = client.get('/api/drivers/schema')
          assert schema.status_code == 200
          assert schema.json()['company_count'] == 10
          assert schema.json()['metric_count'] == 43

          companies = client.get('/api/drivers/companies')
          assert companies.status_code == 200
          assert companies.json()['count'] == 10

          alphabet = client.get('/api/drivers/GOOG')
          assert alphabet.status_code == 200
          assert alphabet.json()['ticker'] == 'GOOGL'
          assert alphabet.json()['metric_count'] == 4

          unsupported = client.get('/api/drivers/AMD')
          assert unsupported.status_code == 404
          print('PHASE3A_ROUTES_OK')
          PY

      - name: Commit app wiring
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.py
          git commit -m "Wire Phase 3A company driver API" || true
          git pull --rebase origin phase3a-company-driver-registry
          git push
