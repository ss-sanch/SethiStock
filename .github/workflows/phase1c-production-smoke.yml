name: Phase 1C Production Smoke

on:
  push:
    branches:
      - phase1c-production-smoke

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check live quote endpoint
        run: |
          python - <<'PY'
          import json, time, urllib.request
          url = 'https://sethistock-api.onrender.com/api/quote/AAPL'
          last_error = None
          for attempt in range(8):
              try:
                  with urllib.request.urlopen(url, timeout=60) as response:
                      data = json.load(response)
                  assert data.get('ticker') == 'AAPL', data
                  assert isinstance(data.get('current_price'), (int, float)) and data['current_price'] > 0, data
                  assert 'market_cap' in data, data
                  assert isinstance(data.get('peers'), list) and len(data['peers']) == 3, data
                  print('Production quote endpoint passed:', data)
                  break
              except Exception as exc:
                  last_error = exc
                  if attempt == 7:
                      raise
                  time.sleep(10)
          PY
