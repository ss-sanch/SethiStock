name: Phase 2A Final Production Proof

on:
  push:
    branches:
      - phase2a-final-production-proof

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Render SEC production flow
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          base = 'https://sethistock-api.onrender.com'

          def get(path, timeout=90):
              try:
                  with urllib.request.urlopen(base + path, timeout=timeout) as response:
                      return response.status, json.load(response)
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode('utf-8', errors='replace')
                  try:
                      payload = json.loads(body)
                  except Exception:
                      payload = {'raw': body[:1000]}
                  return exc.code, payload

          deadline = time.time() + 300
          last_status = None
          while time.time() < deadline:
              status, payload = get('/api/sec/status', 60)
              last_status = (status, payload)
              print('SEC_STATUS=' + str(status) + ':' + json.dumps(payload, sort_keys=True))
              if status == 200 and payload.get('configured') is True:
                  break
              time.sleep(10)
          else:
              raise AssertionError(f'SEC_USER_AGENT never became configured: {last_status}')

          status, apple = get('/api/sec/AAPL/overview', 120)
          print('AAPL_OVERVIEW_STATUS=' + str(status))
          print('AAPL_OVERVIEW=' + json.dumps(apple, sort_keys=True)[:4000])
          assert status == 200, (status, apple)
          assert apple.get('ticker') == 'AAPL'
          assert apple.get('cik') == 320193
          us_gaap = next((x for x in apple.get('taxonomies', []) if x.get('taxonomy') == 'us-gaap'), None)
          assert us_gaap and us_gaap.get('concept_count', 0) > 100, us_gaap

          q = urllib.parse.urlencode({'q': 'revenue', 'limit': 25})
          status, revenues = get('/api/sec/AAPL/concepts?' + q, 90)
          print('REVENUE_SEARCH_STATUS=' + str(status))
          print('REVENUE_MATCHES=' + json.dumps([x.get('concept') for x in revenues.get('concepts', [])[:10]]))
          assert status == 200, (status, revenues)
          assert revenues.get('count', 0) > 0

          q = urllib.parse.urlencode({'concept': 'Assets', 'limit': 500})
          status, assets = get('/api/sec/AAPL/concept?' + q, 90)
          print('ASSETS_STATUS=' + str(status))
          assert status == 200, (status, assets)
          usd = (assets.get('units') or {}).get('USD') or []
          assert usd and all(row.get('val') is not None for row in usd)
          ends = sorted({row.get('end') for row in usd if row.get('end')})
          print('AAPL_ASSET_ROWS=' + str(len(usd)))
          print('AAPL_ASSET_RANGE=' + json.dumps({'earliest': ends[0] if ends else None, 'latest': ends[-1] if ends else None}))
          assert len(ends) >= 10, ends

          for ticker, expected_cik in [('MSFT', 789019), ('GOOGL', 1652044)]:
              status, company = get(f'/api/sec/{ticker}/overview', 120)
              print(f'{ticker}_OVERVIEW_STATUS=' + str(status))
              print(f'{ticker}_OVERVIEW=' + json.dumps(company, sort_keys=True)[:2500])
              assert status == 200, (ticker, status, company)
              assert company.get('cik') == expected_cik, company
              assert any(x.get('taxonomy') == 'us-gaap' for x in company.get('taxonomies', [])), company

          print('PHASE2A_FINAL_PRODUCTION_OK')
          PY
