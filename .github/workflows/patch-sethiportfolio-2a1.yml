name: Patch SethiPortfolio 2A.1
on:
  push:
    branches:
      - fix/sethiportfolio-performance-methodology
    paths:
      - scripts/patch_sethiportfolio_2a1.py
      - .github/workflows/patch-sethiportfolio-2a1.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sethiportfolio-performance-methodology
      - run: python scripts/patch_sethiportfolio_2a1.py
      - run: python -m py_compile app.py sethiportfolio.py market_risk_lab.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sethiportfolio.py
          git diff --cached --quiet && exit 0
          git commit -m "Fix SethiPortfolio performance methodology [skip ci]"
          git push origin HEAD:fix/sethiportfolio-performance-methodology
