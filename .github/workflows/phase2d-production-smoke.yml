name: Phase 2D Production Smoke

on:
  push:
    branches: [phase2d-production-smoke]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed period engine
        run: |
          python - <<'PY'
          import json
          import math
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          base = 'https://sethistock-api.onrender.com'

          def get(path, timeout=180):
              try:
                  with urllib.request.urlopen(base + path, timeout=timeout) as response:
                      return response.status, json.load(response)
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode('utf-8', errors='replace')
                  try:
                      return exc.code, json.loads(body)
                  except Exception:
                      return exc.code, {'raw': body[:1000]}

          deadline = time.time() + 420
          last = None
          while time.time() < deadline:
              status, schema = get('/api/sec/periods/schema', 90)
              last = (status, schema)
              if status == 200 and schema.get('period_engine_version') == '2d-v1':
                  print('PERIOD_ENGINE_READY=' + json.dumps(schema, sort_keys=True))
                  break
              print('WAITING=' + str(status) + ':' + json.dumps(schema, sort_keys=True)[:300])
              time.sleep(10)
          else:
              raise AssertionError(f'Phase 2D did not deploy before timeout: {last}')

          def series(ticker, period, metrics, limit=120):
              query = urllib.parse.urlencode({'period': period, 'metrics': ','.join(metrics), 'limit': limit})
              started = time.time()
              status, payload = get(f'/api/sec/{ticker}/fundamentals/series?' + query, 240)
              elapsed = time.time() - started
              assert status == 200, (ticker, period, status, payload)
              assert payload['period_engine_version'] == '2d-v1'
              assert payload['period'] == period
              assert payload['storage']['backend'] == 'supabase', payload.get('storage')
              for metric_name, metric in payload['metrics'].items():
                  for point in metric['series']:
                      value = point.get('value')
                      assert isinstance(value, (int, float)) and math.isfinite(value), (ticker, period, metric_name, point)
              return payload, elapsed

          aapl_annual, aa = series('AAPL', 'annual', ['revenue','operating_cash_flow','free_cash_flow','net_margin','cash'], 40)
          aapl_quarterly, aq = series('AAPL', 'quarterly', ['revenue','operating_cash_flow','free_cash_flow','net_margin','cash'], 120)
          aapl_ttm, at = series('AAPL', 'ttm', ['revenue','operating_cash_flow','free_cash_flow','net_margin','cash'], 120)
          assert aapl_annual['metrics']['revenue']['count'] >= 15
          assert aapl_quarterly['metrics']['revenue']['count'] >= 60
          assert aapl_ttm['metrics']['revenue']['count'] >= 50
          assert aapl_ttm['metrics']['cash']['ttm_semantics'] == 'point_in_time'
          assert aapl_annual['fiscal_calendar']['latest_completed_fiscal_year'] == 2025
          assert aapl_annual['fiscal_calendar']['open_fiscal_year'] == 2026

          wmt_annual, wa = series('WMT', 'annual', ['revenue','operating_cash_flow'], 40)
          wmt_quarterly, wq = series('WMT', 'quarterly', ['revenue','operating_cash_flow'], 120)
          assert wmt_annual['fiscal_calendar']['latest_completed_fiscal_year'] >= 2026
          assert wmt_quarterly['metrics']['revenue']['count'] >= 60

          msft_quarterly, mq = series('MSFT', 'quarterly', ['revenue'], 120)
          msft_ttm, mt = series('MSFT', 'ttm', ['revenue'], 120)
          fy2016 = [point for point in msft_quarterly['metrics']['revenue']['series'] if point['fiscal_year'] == 2016]
          assert len(fy2016) == 4, fy2016
          assert all(point.get('reconciliation_status') == 'basis_mismatch' for point in fy2016), fy2016
          assert all('concept_basis_change' in point.get('quality_flags', []) for point in fy2016), fy2016
          bad_ttm = {f'TTM FY2016 Q{q}' for q in (1,2,3,4)}
          assert not bad_ttm.intersection({point['label'] for point in msft_ttm['metrics']['revenue']['series']})

          print('PHASE2D_PRODUCTION=' + json.dumps({
              'AAPL': {
                  'annual_revenue': aapl_annual['metrics']['revenue']['count'],
                  'quarterly_revenue': aapl_quarterly['metrics']['revenue']['count'],
                  'ttm_revenue': aapl_ttm['metrics']['revenue']['count'],
                  'calendar': aapl_annual['fiscal_calendar'],
                  'seconds': {'annual': round(aa,3), 'quarterly': round(aq,3), 'ttm': round(at,3)},
              },
              'WMT': {
                  'calendar': wmt_annual['fiscal_calendar'],
                  'quarterly_revenue': wmt_quarterly['metrics']['revenue']['count'],
                  'seconds': {'annual': round(wa,3), 'quarterly': round(wq,3)},
              },
              'MSFT': {
                  'fy2016_status': sorted({point.get('reconciliation_status') for point in fy2016}),
                  'ttm_revenue': msft_ttm['metrics']['revenue']['count'],
                  'seconds': {'quarterly': round(mq,3), 'ttm': round(mt,3)},
              },
          }, sort_keys=True))
          print('PHASE2D_PRODUCTION_OK')
          PY
