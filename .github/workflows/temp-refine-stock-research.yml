name: Temporary stock research refinement

on:
  push:
    branches:
      - feature/sethistock-research-labs
    paths:
      - .github/workflows/temp-refine-stock-research.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/sethistock-research-labs
          fetch-depth: 0

      - name: Refine five-day event study
        run: python scripts/refine_stock_research.py

      - name: Check Python syntax
        run: python -m py_compile app.py stock_research.py

      - name: Commit refinement and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock_research.py
          git rm scripts/refine_stock_research.py .github/workflows/temp-refine-stock-research.yml
          git commit -m "Refine SethiStock research event study [skip ci]"
          git push origin feature/sethistock-research-labs
