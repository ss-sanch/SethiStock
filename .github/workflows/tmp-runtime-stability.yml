name: Temporary runtime stability validation

on:
  push:
    branches: [phase4a-runtime-stability]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase4a-runtime-stability
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply runtime patch
        run: python tmp_runtime_stability_patch.py
      - name: Syntax check
        run: python -m py_compile app.py
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Stress the cold-analysis gate
        run: |
          python - <<'PY'
          import time
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import app

          tickers = ['GOOGL', 'AMZN', 'UBER', 'SPGI']
          started = time.perf_counter()

          def run(symbol):
              t0 = time.perf_counter()
              result = app.get_stock_data(symbol, None, False)
              return symbol, round(time.perf_counter() - t0, 2), result

          results = {}
          with ThreadPoolExecutor(max_workers=4) as executor:
              futures = [executor.submit(run, symbol) for symbol in tickers]
              for future in as_completed(futures):
                  symbol, seconds, payload = future.result()
                  results[symbol] = payload
                  print({'ticker': symbol, 'seconds': seconds, 'price': payload.get('current_price')})

          status = app.runtime_status()
          print({'elapsed_seconds': round(time.perf_counter() - started, 2), 'runtime': status})
          assert set(results) == set(tickers)
          assert all((payload.get('current_price') or 0) > 0 for payload in results.values())
          assert status['stock_analyses_active'] == 0
          assert status['stock_analyses_peak'] <= 1, status
          assert status['max_concurrent_stock_analyses'] == 1
          print('RUNTIME_STABILITY_STRESS_OK')
          PY
      - name: Commit validated application change only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f tmp_runtime_stability_patch.py .github/workflows/tmp-runtime-stability.yml
          git add app.py
          git commit -m "Bound SethiStock analysis concurrency"
          git push origin HEAD:phase4a-runtime-stability
