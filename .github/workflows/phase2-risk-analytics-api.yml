name: Phase 2.4 Portfolio Risk Analytics API

on:
  push:
    branches: [phase2-risk-analytics-api]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2-risk-analytics-api

      - name: Apply risk analytics API patch
        run: python .github/scripts/phase2_risk_analytics_api_patch.py

      - name: Validate Python syntax
        run: |
          python -m py_compile sethiportfolio.py market_risk_lab.py
          grep -q 'def get_risk_analytics' sethiportfolio.py
          grep -q 'effective_holdings' sethiportfolio.py
          grep -q 'weighted_average_correlation' sethiportfolio.py
          grep -q 'risk_minus_weight_pp' sethiportfolio.py

      - name: Commit risk analytics API
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Patch already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sethiportfolio.py
          git commit -m "Add portfolio risk analytics summary API"
          git push origin HEAD:phase2-risk-analytics-api
