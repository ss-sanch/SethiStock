name: Phase 3C Rollout Validation

on:
  push:
    branches: [phase3c-flagship-rollout]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase3c-flagship-rollout
      - name: Install dependencies
        run: pip install beautifulsoup4 requests fastapi
      - name: Apply Phase 3C rollout patch
        run: python .phase3c_rollout_patch.py
      - name: Validate expanded rules and coverage
        run: |
          python -m py_compile company_driver_history.py company_drivers.py
          python - <<'PY'
          import company_driver_history as h
          assert h.DRIVER_HISTORY_VERSION=='3c-history-v1'
          expected=[
            ('AAPL','iphone_revenue'),('AAPL','wearables_home_accessories_revenue'),
            ('MSFT','intelligent_cloud_revenue'),('MSFT','microsoft_cloud_revenue'),
            ('GOOGL','google_search_revenue'),('GOOGL','youtube_ads_revenue'),('GOOGL','google_cloud_revenue'),('GOOGL','google_cloud_operating_income'),
            ('AMZN','aws_revenue'),('AMZN','aws_operating_income'),('AMZN','advertising_services_revenue'),('AMZN','international_revenue'),
            ('META','family_of_apps_revenue'),('META','reality_labs_revenue'),('META','reality_labs_operating_income'),
            ('NVDA','data_center_revenue'),('TSLA','automotive_revenue')
          ]
          for key in expected:
              assert h.get_verified_rule(*key), key
              assert h.metric_coverage(*key)['state']=='verified_sec_history'
          assert h.metric_coverage('TSLA','vehicle_deliveries')['state']=='official_ir_required'
          assert h.metric_coverage('NVDA','gaming_revenue')['state']=='historical_definition_changed'
          assert h.metric_coverage('V','processed_transactions')['state']=='official_filing_table'
          assert h.metric_coverage('NFLX','paid_memberships')['state']=='historical_filing_series'
          assert h.metric_coverage('JPM','cet1_ratio')['state']=='official_filing_table'

          metric={'period_semantics':'duration'}
          family={
            'numeric':True,'value':60.37,'period_semantics':'duration','taxonomy':'us-gaap','concept':'RevenueFromContractWithCustomerExcludingAssessedTax',
            'qualified_concept':'us-gaap:RevenueFromContractWithCustomerExcludingAssessedTax',
            'dimensions':[{'dimension':'us-gaap:StatementBusinessSegmentsAxis','member':'meta:FamilyOfAppsMember'}]
          }
          ad={**family,'value':59.36,'dimensions':[
            {'dimension':'us-gaap:StatementBusinessSegmentsAxis','member':'meta:FamilyOfAppsMember'},
            {'dimension':'srt:ProductOrServiceAxis','member':'us-gaap:AdvertisingMember'}]}
          rule=h.get_verified_rule('META','family_of_apps_revenue')
          assert h._fact_matches_rule(family,metric,rule)
          assert not h._fact_matches_rule(ad,metric,rule)
          print('PHASE3C_ROLLOUT_RULES_OK',len(expected))
          PY
      - name: Validate FastAPI coverage route
        run: |
          python - <<'PY'
          import company_drivers
          routes={r.path for r in company_drivers.router.routes}
          assert '/api/drivers/{ticker}/coverage' in routes
          print('PHASE3C_COVERAGE_ROUTE_OK')
          PY
      - name: Commit permanent Phase 3C changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add company_driver_history.py company_drivers.py
          git commit -m "Expand verified flagship KPI coverage" || true
          git pull --rebase origin phase3c-flagship-rollout
          git push
