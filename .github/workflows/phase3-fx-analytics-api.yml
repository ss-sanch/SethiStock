name: Phase 3.2 FX Analytics API

on:
  push:
    branches: [phase3-fx-analytics-api]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase3-fx-analytics-api
      - name: Apply FX analytics API patch
        run: python .github/scripts/phase3_fx_analytics_api_patch.py
      - name: Validate backend syntax and anchors
        shell: bash
        run: |
          python -m py_compile sethiportfolio.py
          grep -q 'def _portfolio_fx_analytics' sethiportfolio.py
          grep -q '@router.get("/{slug}/fx-analytics")' sethiportfolio.py
          grep -q 'transaction_aware_quote_currency_fx_attribution' sethiportfolio.py
          grep -q 'GBP-quoted funds have zero quote-currency FX translation' sethiportfolio.py
      - name: Commit FX analytics API
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Patch already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sethiportfolio.py
          git commit -m 'Add transaction-aware FX analytics API'
          git push origin HEAD:phase3-fx-analytics-api
