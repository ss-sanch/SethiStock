name: Company Driver Cache Warmer

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */12 * * *'

permissions:
  contents: read

concurrency:
  group: sethistock-company-driver-cache-warmer
  cancel-in-progress: false

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Warm verified flagship Company Drivers
        env:
          SETHISTOCK_API: https://sethistock-api.onrender.com
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from collections import deque

          base = os.environ['SETHISTOCK_API'].rstrip('/')
          headers = {'User-Agent': 'SethiStock Company Driver cache warmer/1.1'}
          warm_periods = ('quarterly', 'annual')
          # These verified rules currently return quarterly observations only.
          quarterly_only = {
              ('AMZN', 'advertising_services_revenue'),
              ('JPM', 'cet1_ratio'),
              ('NFLX', 'paid_memberships'),
              ('V', 'processed_transactions'),
          }
          pending_states = {'stale', 'stale_while_revalidate'}
          refresh_timeout = 12 * 60

          def get_json(path, timeout=180, attempts=4):
              last = None
              for attempt in range(1, attempts + 1):
                  try:
                      req = urllib.request.Request(base + path, headers=headers)
                      with urllib.request.urlopen(req, timeout=timeout) as response:
                          return json.load(response)
                  except urllib.error.HTTPError as exc:
                      if exc.code not in (429, 500, 502, 503, 504):
                          raise
                      last = repr(exc)
                      retry_after = exc.headers.get('Retry-After', '')
                      delay = max(15 * attempt, int(retry_after)) if retry_after.isdecimal() else 15 * attempt
                  except (urllib.error.URLError, TimeoutError, ConnectionError) as exc:
                      last = repr(exc)
                      delay = 15 * attempt
                  if attempt < attempts:
                      time.sleep(delay)
              raise RuntimeError(f'{path}: {last}')

          companies_payload = get_json('/api/drivers/companies', timeout=60)
          companies = [row['ticker'] for row in companies_payload.get('companies', [])]
          assert len(companies) == 10, companies_payload
          assert 'GOOGL' in companies, companies

          # GOOG and GOOGL share one Alphabet filing history. Validate the public
          # alias on every warmer run so both share the same persisted cache keys.
          goog = get_json('/api/drivers/GOOG', timeout=60)
          assert goog.get('ticker') == 'GOOGL', goog
          assert goog.get('requested_ticker') == 'GOOG', goog
          print('GOOG_ALIAS_OK=GOOG->GOOGL', flush=True)

          tasks = []
          coverage_summary = {}
          for ticker in companies:
              coverage = get_json(f'/api/drivers/{urllib.parse.quote(ticker)}/coverage', timeout=90)
              verified = [row['key'] for row in coverage.get('metrics', []) if row.get('verified') is True]
              assert verified, f'{ticker}: no verified Company Drivers'
              coverage_summary[ticker] = verified
              for metric in verified:
                  for period in warm_periods:
                      if period == 'annual' and (ticker, metric) in quarterly_only:
                          continue
                      tasks.append((ticker, metric, period))

          print('WARM_TARGETS=' + json.dumps({k: len(v) for k, v in coverage_summary.items()}, sort_keys=True), flush=True)
          print('WARM_PERIODS=' + ','.join(warm_periods), flush=True)

          def warm_one(item, started):
              ticker, metric, period = item
              path = (
                  f'/api/drivers/{urllib.parse.quote(ticker)}/history/{urllib.parse.quote(metric)}'
                  f'?filings=16&period={urllib.parse.quote(period)}&limit=40'
              )
              payload = get_json(path)
              state = payload.get('cache_state')
              elapsed = time.monotonic() - started
              if state in pending_states:
                  if elapsed >= refresh_timeout:
                      raise RuntimeError(f'{path}: refresh did not finish ({state})')
                  return None
              observations = payload.get('observation_count', len(payload.get('observations') or []))
              if (payload.get('verified') is not True or payload.get('cache_persistent') is not True
                      or payload.get('cache_fresh') is not True or not observations):
                  raise RuntimeError(f'{path}: expected a fresh, persisted, verified history; '
                                     f'got {state} with {observations} observations')

              return {
                  'ticker': ticker,
                  'metric': metric,
                  'period': period,
                  'verified': payload.get('verified'),
                  'observations': observations,
                  'cache_state': state,
                  'persistent': payload.get('cache_persistent'),
                  'seconds': round(elapsed, 3),
              }

          results = []
          failures = []
          remaining = deque(tasks)
          pending = {}

          def check_history(item, started):
              try:
                  result = warm_one(item, started)
                  if result is None:
                      pending[item] = started
                      return
                  results.append(result)
                  print('WARM_OK=' + json.dumps(result, separators=(',', ':')), flush=True)
              except Exception as exc:
                  failures.append({'ticker': item[0], 'metric': item[1], 'period': item[2], 'error': repr(exc)})
                  print('WARM_FAIL=' + json.dumps(failures[-1], separators=(',', ':')), flush=True)
              pending.pop(item, None)

          while remaining or pending:
              # The API allows two background refreshes. Poll those histories before
              # asking it to take on more work, while still serving stale data to users.
              for item, started in tuple(pending.items()):
                  check_history(item, started)
              while remaining and len(pending) < 2:
                  check_history(remaining.popleft(), time.monotonic())
              if pending:
                  time.sleep(15)

          persistent = sum(1 for row in results if row.get('persistent') is True)
          verified = sum(1 for row in results if row.get('verified') is True)
          by_period = {
              period: {
                  'completed': sum(1 for row in results if row.get('period') == period),
                  'persistent': sum(1 for row in results if row.get('period') == period and row.get('persistent') is True),
              }
              for period in warm_periods
          }
          summary = {
              'companies': len(companies),
              'targets': len(tasks),
              'completed': len(results),
              'verified': verified,
              'persistent': persistent,
              'periods': by_period,
              'failures': len(failures),
          }
          print('COMPANY_DRIVER_WARMER_SUMMARY=' + json.dumps(summary, separators=(',', ':')), flush=True)

          if failures:
              raise AssertionError(f'Company Driver warmer failures: {failures}')
          if len(results) != len(tasks):
              raise AssertionError(f'Incomplete warmer coverage: {summary}')
          print('COMPANY_DRIVER_CACHE_WARM_OK', flush=True)
          PY
