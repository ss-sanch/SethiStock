name: Phase 1E Refresh Ordering

on:
  push:
    branches:
      - phase1e-stale-while-revalidate

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1e-stale-while-revalidate
      - name: Apply ordering patch
        run: python .phase1e_order_patch.py
      - name: Validate
        run: |
          python -m py_compile app.py
          python - <<'PY'
          from pathlib import Path
          text = Path('app.py').read_text(encoding='utf-8')
          quote_pos = text.index('live_quote = get_stock_quote(ticker, background_tasks)')
          refresh_pos = text.index('_schedule_cache_refresh(background_tasks, f"stock_analysis:{ticker}"')
          assert quote_pos < refresh_pos
          print('Quote refresh is prioritised before heavy analysis refresh.')
          PY
      - name: Commit ordering fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet && exit 0
          git commit -m "Prioritise quote refresh before analysis"
          git push
