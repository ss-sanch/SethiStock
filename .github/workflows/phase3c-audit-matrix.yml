name: Phase 3C Matrix Audit

on:
  push:
    branches: [phase3c-audit-matrix]

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        ticker: [AAPL, MSFT, GOOGL, AMZN, META, NVDA, TSLA, NFLX, JPM, V]
    runs-on: ubuntu-latest
    steps:
      - name: Audit ${{ matrix.ticker }} KPIs
        env:
          TICKER: ${{ matrix.ticker }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          ticker=os.environ['TICKER']
          base='https://sethistock-api.onrender.com/api/drivers'
          def get(path, timeout=180):
              with urllib.request.urlopen(base+path, timeout=timeout) as r:
                  return json.load(r)
          reg=get('/'+ticker)
          rows=[]
          for metric in reg['metrics']:
              key=metric['key']
              try:
                  result=get(f'/{ticker}/discover/{key}?filings=1&limit=10', timeout=180)
                  top=[]
                  for c in (result.get('candidates') or [])[:6]:
                      top.append({
                          'score':c.get('score'),'concept':c.get('qualified_concept'),'value':c.get('value'),
                          'period':[c.get('start'),c.get('end'),c.get('instant')],
                          'dimensions':c.get('dimensions'),'form':c.get('form'),'filing_date':c.get('filing_date'),
                          'accession':c.get('accession')
                      })
                  rows.append({'metric':key,'label':metric.get('label'),'value_kind':metric.get('value_kind'),
                               'period_semantics':metric.get('period_semantics'),'source_priority':metric.get('source_priority'),
                               'candidate_count':result.get('candidate_count'),'top':top})
              except Exception as exc:
                  rows.append({'metric':key,'label':metric.get('label'),'error':repr(exc)})
          print('PHASE3C_'+ticker+'='+json.dumps(rows,separators=(',',':')))
          PY
