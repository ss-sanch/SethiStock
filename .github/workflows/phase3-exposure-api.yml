name: Phase 3.1 Portfolio Exposure API

on:
  push:
    branches: [phase3-exposure-api]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase3-exposure-api
      - name: Apply exposure API patch
        run: python .github/scripts/phase3_exposure_api_patch.py
      - name: Validate backend syntax and anchors
        shell: bash
        run: |
          python -m py_compile sethiportfolio.py
          grep -q 'def _portfolio_exposure_map' sethiportfolio.py
          grep -q '@router.get("/{slug}/exposures")' sethiportfolio.py
          grep -q 'ETF / Fund — geographic look-through unavailable' sethiportfolio.py
      - name: Commit exposure API
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Patch already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sethiportfolio.py
          git commit -m 'Add portfolio exposure map API'
          git push origin HEAD:phase3-exposure-api
