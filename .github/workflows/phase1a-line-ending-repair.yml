name: Phase 1A Line Ending Repair

on:
  push:
    branches:
      - phase1a-lightweight-peers

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1a-lightweight-peers
          fetch-depth: 0

      - name: Rebuild app.py from main with CRLF preserved
        env:
          PATCH_B64: 
        run: echo "$PATCH_B64" | base64 -d | python

      - name: Validate backend syntax
        run: python -m py_compile app.py

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet && exit 0
          git commit -m "Preserve app.py line endings in Phase 1A"
          git push
