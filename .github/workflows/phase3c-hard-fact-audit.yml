name: Phase 3C Hard Fact Audit

on:
  push:
    branches: [phase3c-hard-fact-audit]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Search hard KPI facts in production
        run: |
          python - <<'PY'
          import json, time, urllib.parse, urllib.request
          base='https://sethistock-api.onrender.com/api/drivers'
          def get(path, timeout=240):
              with urllib.request.urlopen(base+path, timeout=timeout) as r:
                  return json.load(r)
          # Wait for fact-search route deployment.
          deadline=time.time()+360
          while time.time()<deadline:
              try:
                  p=get('/AAPL/facts/search?q=services&filings=1&limit=20')
                  if p.get('data_state')=='raw_filing_fact_search': break
              except Exception: pass
              time.sleep(12)
          else: raise AssertionError('fact search route not deployed')

          checks={
            'AAPL':['services'],
            'V':['processed transaction','payments volume','cross border','credential'],
            'JPM':['net interest','cet1','deposit','loan','provision credit loss'],
            'NFLX':['membership','average revenue membership'],
            'NVDA':['gaming','automotive'],
            'TSLA':['deliver','storage deploy']
          }
          out={}
          for ticker,queries in checks.items():
              rows={}
              for q in queries:
                  path=f'/{ticker}/facts/search?q={urllib.parse.quote(q)}&filings=12&limit=80'
                  result=get(path)
                  slim=[]
                  for m in result.get('matches',[])[:30]:
                      slim.append({
                        'concept':m.get('qualified_concept'),'value':m.get('value'),'numeric':m.get('numeric'),
                        'period':[m.get('start'),m.get('end'),m.get('instant')],
                        'dimensions':m.get('dimensions'),'form':m.get('form'),'filing_date':m.get('filing_date'),
                        'accession':m.get('accession'),'unit':m.get('unit_ref')
                      })
                  rows[q]={'count':result.get('match_count'),'matches':slim}
              out[ticker]=rows
              print('DONE',ticker,flush=True)
          print('PHASE3C_HARD_FACTS='+json.dumps(out,separators=(',',':')))
          PY
