name: Phase 1A Lightweight Peers

on:
  push:
    branches:
      - phase1a-lightweight-peers

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1a-lightweight-peers

      - name: Patch lightweight peer endpoint
        env:
          PATCH_B64: 
        run: echo "$PATCH_B64" | base64 -d | python

      - name: Validate backend syntax
        run: python -m py_compile app.py

      - name: Commit backend change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet && exit 0
          git commit -m "Add lightweight SethiStock peer snapshot API"
          git push
