name: Phase 2A Status Smoke

on:
  push:
    branches:
      - phase2a-status-smoke

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for SEC readiness endpoint
        run: |
          python - <<'PY'
          import json, time, urllib.error, urllib.request
          url = 'https://sethistock-api.onrender.com/api/sec/status'
          deadline = time.time() + 240
          last = None
          while time.time() < deadline:
              try:
                  with urllib.request.urlopen(url, timeout=45) as response:
                      last = json.load(response)
                      if isinstance(last, dict) and 'configured' in last:
                          print('SEC_STATUS=' + json.dumps(last, sort_keys=True))
                          break
              except urllib.error.HTTPError as exc:
                  print('WAIT_HTTP=' + str(exc.code))
              except Exception as exc:
                  print('WAIT_ERROR=' + repr(exc))
              time.sleep(10)
          else:
              raise AssertionError(f'SEC status endpoint not deployed: {last}')
          assert last.get('max_requests_per_second', 99) <= 10, last
          PY
