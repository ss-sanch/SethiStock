name: Fix admin draft read
on:
  push:
    branches: [fix/sethiportfolio-admin-draft-read]
    paths:
      - scripts/fix_admin_draft_read.py
      - .github/workflows/fix-admin-draft-read.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sethiportfolio-admin-draft-read
      - run: python scripts/fix_admin_draft_read.py
      - run: python -m py_compile sethiportfolio.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sethiportfolio.py
          git diff --cached --quiet && exit 0
          git commit -m "Fix authenticated admin draft reads [skip ci]"
          git push origin HEAD:fix/sethiportfolio-admin-draft-read
