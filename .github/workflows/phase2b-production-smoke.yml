name: Phase 2B Production Smoke

on:
  push:
    branches:
      - phase2b-production-smoke

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Alphabet normalized margin contexts
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.parse
          import urllib.request

          base = 'https://sethistock-api.onrender.com'

          def get(path, timeout=120):
              try:
                  with urllib.request.urlopen(base + path, timeout=timeout) as response:
                      return response.status, json.load(response)
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode('utf-8', errors='replace')
                  try:
                      return exc.code, json.loads(body)
                  except Exception:
                      return exc.code, {'raw': body[:1000]}

          q = urllib.parse.urlencode({'metrics': 'revenue,net_income,net_margin', 'limit': 50})
          status, payload = get('/api/sec/GOOGL/fundamentals/normalized?' + q, 180)
          assert status == 200, (status, payload)
          metrics = payload['metrics']
          for name in ['revenue', 'net_income', 'net_margin']:
              rows = metrics[name]['observations']
              print(name.upper() + '_LAST_12=' + json.dumps(rows[-12:], sort_keys=True))

          # Also print all raw NetIncomeLoss facts ending at the latest normalized date.
          latest_end = metrics['net_margin']['observations'][-1]['end']
          q = urllib.parse.urlencode({'taxonomy': 'us-gaap', 'concept': 'NetIncomeLoss', 'limit': 500})
          status, raw_net = get('/api/sec/GOOGL/concept?' + q, 180)
          assert status == 200, (status, raw_net)
          raw_rows = (raw_net.get('units') or {}).get('USD') or []
          print('RAW_NET_LATEST_END=' + json.dumps([r for r in raw_rows if r.get('end') == latest_end], sort_keys=True))

          q = urllib.parse.urlencode({'taxonomy': 'us-gaap', 'concept': 'RevenueFromContractWithCustomerExcludingAssessedTax', 'limit': 500})
          status, raw_rev = get('/api/sec/GOOGL/concept?' + q, 180)
          assert status == 200, (status, raw_rev)
          raw_rows = (raw_rev.get('units') or {}).get('USD') or []
          print('RAW_REV_LATEST_END=' + json.dumps([r for r in raw_rows if r.get('end') == latest_end], sort_keys=True))
          print('PHASE2B_CONTEXT_PROBE_OK')
          PY
