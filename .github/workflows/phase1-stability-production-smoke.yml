name: Phase 1 Stability Production Smoke

on:
  push:
    branches:
      - phase1-stability-production-smoke

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for hotfix deployment and verify Visa
        run: |
          python - <<'PY'
          import json, math, time, urllib.parse, urllib.request

          base = 'https://sethistock-api.onrender.com'

          def get(path, timeout=150):
              with urllib.request.urlopen(base + path, timeout=timeout) as r:
                  return json.load(r)

          deadline = time.time() + 240
          status = None
          while time.time() < deadline:
              try:
                  status = get('/api/cache/status', 45)
                  if status.get('ready') is True and status.get('max_heavy_refreshes') == 1:
                      break
              except Exception as exc:
                  print('WAIT_ERROR=' + repr(exc))
              time.sleep(10)
          else:
              raise AssertionError(f'Hotfix not deployed in time: {status}')

          print('CACHE_STATUS=' + json.dumps(status, sort_keys=True))

          chart = get('/api/chart/V?period=3mo&interval=1d')
          closes = chart.get('closes') or []
          assert len(closes) >= 2, chart
          assert all(isinstance(v, (int, float)) and math.isfinite(v) and v > 0 for v in closes), closes[-5:]
          pct = (closes[-1] - closes[0]) / closes[0] * 100
          assert math.isfinite(pct) and pct > -99.0, pct
          print('V_3MO_POINTS=' + str(len(closes)))
          print('V_3MO_LAST=' + str(closes[-1]))
          print('V_3MO_RETURN=' + str(round(pct, 3)))

          started = time.perf_counter()
          stock = get('/api/stock/V', 180)
          elapsed = time.perf_counter() - started
          stats = stock.get('stats') or {}
          assert stock.get('ticker') == 'V', stock
          assert isinstance(stock.get('current_price'), (int, float)) and stock['current_price'] > 0, stock.get('current_price')
          assert 'nan' not in str(stats.get('sma_200_pct', '')).lower(), stats.get('sma_200_pct')
          assert str(stats.get('dist_52w_high')) != '-100.0%', stats.get('dist_52w_high')
          assert str(stats.get('div_yield')) != '73.0%', stats.get('div_yield')
          print('V_STOCK_SECONDS=' + str(round(elapsed, 3)))
          print('V_STOCK=' + json.dumps({
              'price': stock.get('current_price'),
              'div_yield': stats.get('div_yield'),
              'sma_200_pct': stats.get('sma_200_pct'),
              'dist_52w_high': stats.get('dist_52w_high'),
          }, sort_keys=True))

          combos = [('1d','5m'), ('1mo','1d'), ('3mo','1d'), ('1y','1d')]
          for period, interval in combos:
              data = get(f'/api/chart/V?period={period}&interval={interval}')
              vals = data.get('closes') or []
              assert vals, (period, interval, data)
              assert all(isinstance(v, (int, float)) and math.isfinite(v) and v > 0 for v in vals), (period, vals[-5:])
              print(f'CHART_OK={period}/{interval}:{len(vals)}')
          PY
