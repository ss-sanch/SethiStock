name: Validate MRL derivatives engine
on:
  push:
    branches:
      - feature/mrl-derivatives-risk
    paths:
      - market_risk_lab.py
      - scripts/preserve_equity_var_path.py
      - .github/workflows/validate-mrl-derivatives.yml
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mrl-derivatives-risk
      - run: python scripts/preserve_equity_var_path.py
      - run: python -m py_compile market_risk_lab.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market_risk_lab.py
          git diff --cached --quiet && exit 0
          git commit -m "Preserve equity-only VaR path in derivatives engine [skip ci]"
          git push origin HEAD:feature/mrl-derivatives-risk
