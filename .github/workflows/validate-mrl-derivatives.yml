name: Validate MRL derivatives engine
on:
  push:
    branches:
      - feature/mrl-derivatives-risk
    paths:
      - market_risk_lab.py
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m py_compile market_risk_lab.py
