name: Patch SethiPortfolio Admin API
on:
  push:
    branches:
      - feature/sethiportfolio-admin-api
    paths:
      - scripts/patch_sethiportfolio_admin_api.py
      - .github/workflows/patch-sethiportfolio-admin-api.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sethiportfolio-admin-api
      - run: python scripts/patch_sethiportfolio_admin_api.py
      - run: |
          python -m py_compile app.py sethiportfolio.py
          python - <<'PY'
          from pathlib import Path
          s=Path('sethiportfolio.py').read_text(encoding='utf-8')
          a=Path('app.py').read_text(encoding='utf-8')
          assert '/admin/health' in s
          assert '/admin/{slug}/transaction' in s
          assert '/admin/{slug}/journal' in s
          assert 'SUPABASE_SERVICE_KEY' in s and 'SUPABASE_SERVICE_KEY' in a
          assert 'admin123' not in a
          print('admin API validation passed')
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py sethiportfolio.py
          git diff --cached --quiet && exit 0
          git commit -m "Add authenticated SethiPortfolio admin write API [skip ci]"
          git push origin HEAD:feature/sethiportfolio-admin-api
