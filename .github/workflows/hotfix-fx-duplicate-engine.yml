name: Hotfix FX duplicate engine

on:
  push:
    branches: [hotfix-fx-duplicate-engine]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix-fx-duplicate-engine
      - name: Remove stale duplicate FX engine
        run: python .github/scripts/hotfix_fx_duplicate_engine.py
      - name: Validate backend
        run: |
          python -m py_compile sethiportfolio.py
          python - <<'PY'
          from pathlib import Path
          import ast
          text = Path('sethiportfolio.py').read_text()
          tree = ast.parse(text)
          for name in ('_portfolio_fx_analytics', 'get_fx_analytics'):
              nodes = [n for n in tree.body if isinstance(n, ast.FunctionDef) and n.name == name]
              assert len(nodes) == 1, (name, len(nodes))
          assert 'weighted_average_entry_fx_open_inventory_decomposition' in text
          assert 'FX analytics reconstructed a negative' not in text
          print('FX backend deduplicated and validated')
          PY
      - name: Commit hotfix
        run: |
          if git diff --quiet; then
            echo 'Patch already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sethiportfolio.py
          git commit -m 'Remove stale duplicate FX analytics engine'
          git push origin HEAD:hotfix-fx-duplicate-engine
