name: Phase 3C Hard Fact Matrix

on:
  push:
    branches: [phase3c-hard-fact-matrix]

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        ticker: [AAPL, V, JPM, NFLX, NVDA, TSLA]
    runs-on: ubuntu-latest
    steps:
      - name: Search raw filing facts
        env:
          TICKER: ${{ matrix.ticker }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.parse, urllib.request
          ticker=os.environ['TICKER']
          base='https://sethistock-api.onrender.com/api/drivers'
          def get(path, timeout=240):
              with urllib.request.urlopen(base+path, timeout=timeout) as r: return json.load(r)
          deadline=time.time()+360
          while time.time()<deadline:
              try:
                  x=get('/AAPL/facts/search?q=services&filings=1&limit=5')
                  if x.get('data_state')=='raw_filing_fact_search': break
              except Exception: pass
              time.sleep(10)
          else: raise AssertionError('fact search route not deployed')
          qs={
            'AAPL':['service'],
            'V':['processed','payment volume','crossborder','credential'],
            'JPM':['netinterest','common equity tier','deposit','loan','provision'],
            'NFLX':['paid membership','number paid membership'],
            'NVDA':['gaming','automotive'],
            'TSLA':['deliver','storage deploy']
          }[ticker]
          filings=12 if ticker=='NFLX' else 3
          out={}
          for q in qs:
              p=get(f'/{ticker}/facts/search?q={urllib.parse.quote(q)}&filings={filings}&limit=80')
              out[q]=[{k:m.get(k) for k in ['qualified_concept','value','numeric','start','end','instant','dimensions','form','filing_date','accession','unit_ref']} for m in p.get('matches',[])[:40]]
          print('PHASE3C_FACT_'+ticker+'='+json.dumps(out,separators=(',',':')))
          PY
