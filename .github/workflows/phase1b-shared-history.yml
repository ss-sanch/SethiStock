name: Phase 1B Shared Price History

on:
  push:
    branches:
      - phase1b-shared-price-history

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1b-shared-price-history

      - name: Reuse one stock price history fetch
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          path = Path('app.py')
          with open(path, 'r', encoding='utf-8', newline='') as f:
              text = f.read()
          nl = '\r\n' if '\r\n' in text else '\n'

          def block(value):
              return textwrap.dedent(value).strip('\n').replace('\n', nl)

          risk_pattern = r'def calculate_risk_profile\(ticker_symbol\):(?:\r?\n).*?(?=\r?\ndef generate_sensitivity_matrix)'
          risk_replacement = block('''
          def calculate_risk_profile(hist):
              try:
                  if hist is None or hist.empty or 'Close' not in hist.columns:
                      return {"error": "Risk Profile Unavailable"}

                  daily_returns = hist['Close'].pct_change().dropna()
                  if daily_returns.empty:
                      return {"error": "Risk Profile Unavailable"}

                  var_95 = np.percentile(daily_returns, 5)
                  volatility = daily_returns.std() * np.sqrt(252)

                  return {
                      "daily_var_95": round(var_95 * 100, 2),
                      "annualized_volatility": round(volatility * 100, 2)
                  }
              except Exception:
                  return {"error": "Risk Profile Unavailable"}
          ''') + nl + nl
          text, risk_count = re.subn(risk_pattern, risk_replacement, text, count=1, flags=re.S)
          if risk_count != 1:
              raise SystemExit(f'Expected one risk-profile function replacement, got {risk_count}.')

          old_recent = block('''
                  recent_hist = pd.DataFrame()
                  try:
                      recent_hist = stock.history(period="5d")
                  except Exception:
                      pass
          ''')
          new_recent = block('''
                  # Shared daily history for price, risk, beta and technical indicators.
                  # One 5Y fetch replaces the former 5D + 5Y + 1Y + 1Y stock-history calls.
                  shared_hist = pd.DataFrame()
                  try:
                      shared_hist = stock.history(period="5y", interval="1d")
                  except Exception:
                      pass

                  recent_hist = shared_hist.tail(5).copy() if shared_hist is not None and not shared_hist.empty else pd.DataFrame()
          ''')
          if old_recent not in text:
              raise SystemExit('Could not find the existing 5-day history block.')
          text = text.replace(old_recent, new_recent, 1)

          old_risk_call = 'risk_metrics = calculate_risk_profile(ticker)'
          if old_risk_call not in text:
              raise SystemExit('Could not find risk profile call.')
          text = text.replace(old_risk_call, 'risk_metrics = calculate_risk_profile(shared_hist)', 1)

          old_daily = 'daily_hist = stock.history(period="1y")'
          if text.count(old_daily) != 2:
              raise SystemExit(f'Expected two duplicate 1Y stock history calls, found {text.count(old_daily)}.')
          text = text.replace(
              old_daily,
              'daily_hist = shared_hist.tail(260).copy() if shared_hist is not None and not shared_hist.empty else pd.DataFrame()'
          )

          with open(path, 'w', encoding='utf-8', newline='') as f:
              f.write(text)
          PY

      - name: Validate syntax and history-call reduction
        run: |
          python -m py_compile app.py
          python - <<'PY'
          from pathlib import Path
          text = Path('app.py').read_text(encoding='utf-8')
          start = text.index('@app.get("/api/stock/{raw_ticker}")')
          end = text.index('@app.get("/api/peers")')
          segment = text[start:end]
          count = segment.count('stock.history(')
          assert count == 1, f'Expected one stock.history call in main stock endpoint, found {count}'
          assert 'calculate_risk_profile(shared_hist)' in segment
          assert segment.count('shared_hist.tail(260)') == 2
          print('Phase 1B static validation passed: one stock history fetch remains in /api/stock.')
          PY

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Smoke test refactored stock endpoint
        env:
          ADMIN_SECRET: test
        run: |
          python - <<'PY'
          import app
          data = app.get_stock_data('AAPL')
          assert data.get('ticker') == 'AAPL'
          assert isinstance(data.get('current_price'), (int, float))
          assert isinstance(data.get('stats'), dict)
          assert 'risk_profile' in data
          for key in ('rsi_14', 'stoch_k', 'sma_200_pct', 'beta'):
              assert key in data['stats'], key
          print('AAPL endpoint smoke test passed.')
          print('price=', data['current_price'])
          print('risk=', data['risk_profile'])
          print('beta=', data['stats'].get('beta'))
          PY

      - name: Commit Phase 1B change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet && exit 0
          git commit -m "Reuse shared price history across SethiStock analytics"
          git push
