name: Phase 3.2 FX Analytics Numerical Test

on:
  push:
    branches: [phase3-fx-analytics-api]

jobs:
  numerical-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Validate FX P&L decomposition
        run: |
          python - <<'PY'
          import math
          import pandas as pd
          import sethiportfolio as sp

          dates = pd.to_datetime(['2026-01-02','2026-01-05','2026-01-06'])
          synthetic = pd.DataFrame({
              'TEST': [100.0, 110.0, 110.0],
              'USDGBP=X': [0.80, 0.84, 0.84],
          }, index=dates)

          sp._download_adjusted_close = lambda symbols, start: synthetic[symbols]
          sp._holdings_snapshot = lambda portfolio, txns: {
              'base_currency': 'GBP',
              'portfolio_value': 10124.0,
              'cash': 9200.0,
              'cash_weight_pct': 90.87,
              'holdings': [{
                  'symbol': 'TEST', 'name': 'Test USD Equity', 'asset_type': 'equity',
                  'currency': 'USD', 'quantity': 10.0, 'market_value': 924.0,
                  'weight_pct': 924.0 / 10124.0 * 100.0,
              }],
          }

          portfolio = {
              'inception_date': '2026-01-02',
              'base_currency': 'GBP',
              'initial_capital': 10000.0,
          }
          txns = [{
              'id': 't1', 'trade_date': '2026-01-02', 'side': 'BUY',
              'quantity': 10.0, 'price': 100.0, 'fees': 0.0,
              'currency': 'USD', 'fx_rate_to_base': 0.80,
              'instruments': {'id':'i1','symbol':'TEST','name':'Test USD Equity','asset_type':'equity','currency':'USD'},
          }]

          result = sp._portfolio_fx_analytics(portfolio, txns)
          si = result['periods']['SI']
          usd = si['currencies'][0]
          sensitivity = result['current_sensitivity']

          assert math.isclose(si['local_price_pnl'], 80.0, abs_tol=1e-6), si
          assert math.isclose(si['fx_pnl'], 44.0, abs_tol=1e-6), si
          assert math.isclose(si['portfolio_return_pct'], 1.24, abs_tol=1e-6), si
          assert math.isclose(si['reconciliation_error'], 0.0, abs_tol=1e-6), si
          assert math.isclose(usd['fx_return_pct'], 5.0, abs_tol=1e-6), usd
          expected_weight = 924.0 / 10124.0 * 100.0
          assert math.isclose(sensitivity['foreign_quote_weight_pct'], round(expected_weight,2), abs_tol=1e-6), sensitivity
          assert math.isclose(sensitivity['impact_pp_if_foreign_currencies_plus_5pct'], round(expected_weight*0.05,4), abs_tol=1e-6), sensitivity
          print('FX decomposition numerical validation passed')
          PY

# trigger