name: Phase 1E Production Ready

on:
  push:
    branches:
      - phase1e-production-smoke

jobs:
  ready:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Phase 1E deployment
        run: |
          python - <<'PY'
          import json, time, urllib.request
          url = 'https://sethistock-api.onrender.com/api/cache/status'
          last = None
          for attempt in range(18):
              try:
                  with urllib.request.urlopen(url, timeout=60) as r:
                      data = json.load(r)
                  last = data
                  swr = data.get('stale_while_revalidate_seconds', {})
                  if data.get('ready') is True and swr.get('stock_analysis') == 86400 and swr.get('quote') == 900:
                      print('PHASE1E_READY=' + json.dumps(data, sort_keys=True))
                      raise SystemExit(0)
                  print(f'Attempt {attempt+1}: not ready yet -> {data}')
              except Exception as exc:
                  print(f'Attempt {attempt+1}: {exc}')
              time.sleep(10)
          raise SystemExit(f'Phase 1E deployment not ready: {last}')
          PY
