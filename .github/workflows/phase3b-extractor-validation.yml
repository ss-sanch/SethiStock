name: Phase 3B Extractor Validation

on:
  push:
    branches: [phase3b-kpi-extraction]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase3b-kpi-extraction

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply Company Drivers route patch
        run: python .phase3b_patch.py

      - name: Validate parser and discovery scoring
        run: |
          python -m py_compile company_driver_filings.py company_drivers.py
          python - <<'PY'
          import company_driver_filings as f

          html = '''
          <html xmlns:ix="http://www.xbrl.org/2013/inlineXBRL"
                xmlns:xbrli="http://www.xbrl.org/2003/instance"
                xmlns:xbrldi="http://xbrl.org/2006/xbrldi"
                xmlns:us-gaap="http://fasb.org/us-gaap/2026"
                xmlns:amzn="http://amazon.com/20260630">
            <ix:header><ix:resources>
              <xbrli:context id="aws_q2">
                <xbrli:entity><xbrli:identifier scheme="x">1018724</xbrli:identifier>
                  <xbrli:segment><xbrldi:explicitMember dimension="us-gaap:StatementBusinessSegmentsAxis">amzn:AmazonWebServicesMember</xbrldi:explicitMember></xbrli:segment>
                </xbrli:entity>
                <xbrli:period><xbrli:startDate>2026-04-01</xbrli:startDate><xbrli:endDate>2026-06-30</xbrli:endDate></xbrli:period>
              </xbrli:context>
              <xbrli:context id="consolidated_q2">
                <xbrli:entity><xbrli:identifier scheme="x">1018724</xbrli:identifier></xbrli:entity>
                <xbrli:period><xbrli:startDate>2026-04-01</xbrli:startDate><xbrli:endDate>2026-06-30</xbrli:endDate></xbrli:period>
              </xbrli:context>
            </ix:resources></ix:header>
            <ix:nonFraction name="us-gaap:RevenueFromContractWithCustomerExcludingAssessedTax" contextRef="aws_q2" unitRef="USD" scale="6">42,232</ix:nonFraction>
            <ix:nonFraction name="us-gaap:RevenueFromContractWithCustomerExcludingAssessedTax" contextRef="consolidated_q2" unitRef="USD" scale="6">200,606</ix:nonFraction>
            <ix:nonFraction name="amzn:AdvertisingServicesSales" contextRef="consolidated_q2" unitRef="USD" scale="6">19,809</ix:nonFraction>
          </html>
          '''
          filing = {
              'form': '10-Q', 'filing_date': '2026-07-31', 'report_date': '2026-06-30',
              'accession': '0001018724-26-000026', 'source_url': 'https://www.sec.gov/example.htm'
          }
          parsed = f.parse_inline_xbrl(html, filing)
          assert parsed['fact_count'] == 3
          assert 'amzn' in parsed['custom_taxonomies']
          aws = parsed['facts'][0]
          assert aws['value'] == 42232000000.0
          assert aws['start'] == '2026-04-01' and aws['end'] == '2026-06-30'
          assert aws['dimensions'][0]['member'] == 'amzn:AmazonWebServicesMember'
          assert aws['accession'] == filing['accession']

          metric = {
              'key': 'aws_revenue', 'label': 'AWS Revenue', 'category': 'cloud',
              'period_semantics': 'duration'
          }
          aws_score = f.score_fact_for_metric(parsed['facts'][0], metric)
          consolidated_score = f.score_fact_for_metric(parsed['facts'][1], metric)
          assert aws_score > consolidated_score, (aws_score, consolidated_score)
          assert aws_score >= 9

          ad_metric = {
              'key': 'advertising_services_revenue', 'label': 'Advertising Services Revenue',
              'category': 'advertising', 'period_semantics': 'duration'
          }
          assert f.score_fact_for_metric(parsed['facts'][2], ad_metric) > 0

          schema = f.extraction_schema()
          assert schema['version'] == '3b-v1'
          assert 'dimensions' in schema['candidate_contract']
          print('PHASE3B_SYNTHETIC_OK')
          PY

      - name: Validate FastAPI route contract
        run: |
          python - <<'PY'
          import company_drivers
          routes = {route.path for route in company_drivers.router.routes}
          expected = {
              '/api/drivers/extraction/schema',
              '/api/drivers/{ticker}/filings',
              '/api/drivers/{ticker}/discover/{metric_key}',
          }
          assert expected.issubset(routes), (routes, expected)
          registry = company_drivers.get_company_driver_registry('GOOG')
          assert registry['ticker'] == 'GOOGL'
          assert company_drivers._driver_metric_definition('AMZN', 'aws_revenue')[1]['key'] == 'aws_revenue'
          print('PHASE3B_ROUTES_OK')
          PY

      - name: Commit Phase 3B routes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add company_drivers.py
          git commit -m "Wire Phase 3B filing discovery routes" || true
          git pull --rebase origin phase3b-kpi-extraction
          git push
