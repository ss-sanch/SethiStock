name: Phase 1E SWR Validation

on:
  push:
    branches:
      - phase1e-stale-while-revalidate

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1e-stale-while-revalidate

      - name: Apply Phase 1E patch
        run: python .phase1e_patch.py

      - name: Validate syntax and wiring
        run: |
          python -m py_compile app.py
          python - <<'PY'
          from pathlib import Path
          text = Path('app.py').read_text(encoding='utf-8')
          required = [
              'from fastapi import FastAPI, HTTPException, BackgroundTasks',
              'def _cache_get_swr(namespace: str, identity: str, max_stale_seconds: int):',
              'def _schedule_cache_refresh(background_tasks, refresh_key: str, bypass_namespace: str, refresh_callable, *args, **kwargs):',
              'CACHE_STALE_STOCK',
              '"stale_while_revalidate_seconds"',
              '_cache_get_swr("stock_analysis", ticker, CACHE_STALE_STOCK)',
              '_cache_get_swr("quote", ticker, CACHE_STALE_QUOTE)',
              '_cache_get_swr("peer_snapshots", cache_identity, CACHE_STALE_PEERS)',
              '_cache_get_swr("chart", cache_identity, CACHE_STALE_CHART)',
          ]
          for token in required:
              assert token in text, token
          print('Phase 1E wiring found.')
          PY

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test stale windows and refresh deduplication
        run: |
          python - <<'PY'
          import asyncio
          from fastapi import BackgroundTasks
          import app

          original_lookup = app._cache_lookup
          try:
              app._cache_lookup = lambda namespace, identity: {
                  'payload': {'ticker': 'AAPL'},
                  'fresh': False,
                  'stale_for_seconds': 120.0,
              }
              payload, state = app._cache_get_swr('quote', 'AAPL', 900)
              assert payload == {'ticker': 'AAPL'} and state == 'stale'

              app._cache_lookup = lambda namespace, identity: {
                  'payload': {'ticker': 'AAPL'},
                  'fresh': False,
                  'stale_for_seconds': 901.0,
              }
              payload, state = app._cache_get_swr('quote', 'AAPL', 900)
              assert payload is None and state == 'expired'

              calls = []
              def refresh_fn():
                  calls.append(app._cache_refresh_bypassed('quote'))

              bt = BackgroundTasks()
              first = app._schedule_cache_refresh(bt, 'quote:AAPL', 'quote', refresh_fn)
              second = app._schedule_cache_refresh(bt, 'quote:AAPL', 'quote', refresh_fn)
              assert first is True and second is False
              assert len(bt.tasks) == 1
              asyncio.run(bt())
              assert calls == [True]
              assert 'quote:AAPL' not in app._CACHE_REFRESH_INFLIGHT
              print('SWR state and deduplication tests passed.')
          finally:
              app._cache_lookup = original_lookup
              app._CACHE_REFRESH_INFLIGHT.clear()
          PY

      - name: Test stale stock returns immediately and queues refresh
        run: |
          python - <<'PY'
          from fastapi import BackgroundTasks
          import app

          original_resolve = app._resolve_ticker_cached
          original_swr = app._cache_get_swr
          original_quote = app.get_stock_quote
          try:
              app._resolve_ticker_cached = lambda raw, background_tasks=None: 'AAPL'
              def fake_swr(namespace, identity, max_stale):
                  if namespace == 'stock_analysis':
                      return ({
                          'ticker': 'AAPL', 'current_price': 100.0, 'change': 0.0, 'pct_change': 0.0,
                          'stats': {'mkt_cap': '$1.00T'}, 'financials': {'years': ['2025']},
                      }, 'stale')
                  return (None, 'miss')
              app._cache_get_swr = fake_swr
              app.get_stock_quote = lambda raw, background_tasks=None: {
                  'ticker': 'AAPL', 'current_price': 125.0, 'change': 2.0,
                  'pct_change': 1.63, 'market_cap': '$2.00T', 'peers': []
              }
              bt = BackgroundTasks()
              result = app.get_stock_data('AAPL', bt)
              assert result['current_price'] == 125.0
              assert result['financials']['years'] == ['2025']
              assert len(bt.tasks) == 1
              assert 'stock_analysis:AAPL' in app._CACHE_REFRESH_INFLIGHT
              print('Stale stock immediate-return test passed.')
          finally:
              app._resolve_ticker_cached = original_resolve
              app._cache_get_swr = original_swr
              app.get_stock_quote = original_quote
              app._CACHE_REFRESH_INFLIGHT.clear()
          PY

      - name: Commit Phase 1E backend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet && exit 0
          git commit -m "Add stale-while-revalidate caching"
          git push
