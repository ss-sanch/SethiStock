name: Fix Admin App Diff
on:
  push:
    branches:
      - feature/sethiportfolio-admin-api
    paths:
      - scripts/fix_admin_app_diff.py
      - .github/workflows/fix-admin-app-diff.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sethiportfolio-admin-api
          fetch-depth: 0
      - run: git fetch origin main
      - run: python scripts/fix_admin_app_diff.py
      - run: python -m py_compile app.py sethiportfolio.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet && exit 0
          git commit -m "Preserve app.py line endings in admin API patch [skip ci]"
          git push origin HEAD:feature/sethiportfolio-admin-api
