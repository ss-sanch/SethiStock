name: Temporary Phase 4A fast initial dashboard patch
on:
  push:
    paths:
      - '.github/workflows/tmp-phase4a-fast-initial-dashboard.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase4a-fast-initial-dashboard
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply backend performance and initial-data patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def load(path):
              raw = Path(path).read_bytes()
              crlf = b'\r\n' in raw
              return raw.decode('utf-8').replace('\r\n', '\n'), crlf

          def save(path, text, crlf):
              if crlf:
                  text = text.replace('\n', '\r\n')
              Path(path).write_bytes(text.encode('utf-8'))

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return text.replace(old, new, 1)

          # ---------- stock_research.py ----------
          text, crlf = load('stock_research.py')
          text = replace_once(
              text,
              'def _historical_valuation_bands(stock, prices, events):\n',
              'def _historical_valuation_bands(stock, prices, events, current_pe_override=None):\n',
              'research valuation signature',
          )
          old_current_pe = '''    current_pe = None\n    try:\n        info = stock.info or {}\n        current_pe = _safe_float(info.get("trailingPE"))\n        if current_pe is None:\n            trailing_eps = _safe_float(info.get("trailingEps"))\n            current_price = _safe_float(prices["Close"].iloc[-1]) if not prices.empty else None\n            if trailing_eps and trailing_eps > 0 and current_price:\n                current_pe = current_price / trailing_eps\n    except Exception:\n        current_pe = None\n'''
          new_current_pe = '''    current_pe = _safe_float(current_pe_override)\n    if current_pe is None:\n        try:\n            info = stock.info or {}\n            current_pe = _safe_float(info.get("trailingPE"))\n            if current_pe is None:\n                trailing_eps = _safe_float(info.get("trailingEps"))\n                current_price = _safe_float(prices["Close"].iloc[-1]) if not prices.empty else None\n                if trailing_eps and trailing_eps > 0 and current_price:\n                    current_pe = current_price / trailing_eps\n        except Exception:\n            current_pe = None\n'''
          text = replace_once(text, old_current_pe, new_current_pe, 'research current PE override')

          old_tail = '''def _calculate_stock_research(ticker):\n    stock = yf.Ticker(ticker)\n    try:\n        prices = _normalise_price_history(stock.history(period="5y", interval="1d", auto_adjust=False))\n    except Exception:\n        prices = pd.DataFrame()\n\n    events = _build_earnings_events(stock, prices)\n    return {\n        "ticker": ticker,\n        "earnings_reaction": _earnings_reaction_study(events),\n        "valuation_bands": _historical_valuation_bands(stock, prices, events),\n        "methodology": {\n            "earnings_reaction": "Close-to-close reaction around historical earnings releases; five-day return is measured from the same pre-release baseline.",\n            "valuation_bands": "P/E is reconstructed after each earnings release using the latest four reported quarterly EPS figures. It is an historical comparison tool, not a live consensus forecast.",\n            "source": "Yahoo Finance via yfinance",\n        },\n    }\n\n\n@router.get("/{raw_ticker}")\ndef get_stock_research(raw_ticker: str):\n    ticker = raw_ticker.strip().upper()\n    if not ticker or len(ticker) > 20:\n        return {"ticker": ticker, "earnings_reaction": {"available": False}, "valuation_bands": {"available": False}}\n\n    now = time.time()\n    cached = _RESEARCH_CACHE.get(ticker)\n    if cached and now - cached[0] < _CACHE_TTL_SECONDS:\n        return cached[1]\n\n    try:\n        result = _calculate_stock_research(ticker)\n    except Exception as exc:\n        result = {\n            "ticker": ticker,\n            "earnings_reaction": {"available": False, "reason": "Research data temporarily unavailable."},\n            "valuation_bands": {"available": False, "reason": "Research data temporarily unavailable."},\n            "error": str(exc),\n        }\n\n    _RESEARCH_CACHE[ticker] = (now, result)\n    return result\n'''
          new_tail = '''def _calculate_stock_research(ticker, stock=None, prices=None, current_pe=None):\n    stock = stock or yf.Ticker(ticker)\n    if prices is None:\n        try:\n            prices = _normalise_price_history(stock.history(period="5y", interval="1d", auto_adjust=False))\n        except Exception:\n            prices = pd.DataFrame()\n    else:\n        prices = _normalise_price_history(prices)\n\n    events = _build_earnings_events(stock, prices)\n    return {\n        "ticker": ticker,\n        "earnings_reaction": _earnings_reaction_study(events),\n        "valuation_bands": _historical_valuation_bands(stock, prices, events, current_pe_override=current_pe),\n        "methodology": {\n            "earnings_reaction": "Close-to-close reaction around historical earnings releases; five-day return is measured from the same pre-release baseline.",\n            "valuation_bands": "P/E is reconstructed after each earnings release using the latest four reported quarterly EPS figures. It is an historical comparison tool, not a live consensus forecast.",\n            "source": "Yahoo Finance via yfinance",\n        },\n    }\n\n\ndef get_stock_research_payload(ticker, stock=None, prices=None, current_pe=None):\n    ticker = str(ticker or '').strip().upper()\n    if not ticker or len(ticker) > 20:\n        return {"ticker": ticker, "earnings_reaction": {"available": False}, "valuation_bands": {"available": False}}\n\n    now = time.time()\n    cached = _RESEARCH_CACHE.get(ticker)\n    if cached and now - cached[0] < _CACHE_TTL_SECONDS:\n        return cached[1]\n\n    try:\n        result = _calculate_stock_research(ticker, stock=stock, prices=prices, current_pe=current_pe)\n    except Exception as exc:\n        result = {\n            "ticker": ticker,\n            "earnings_reaction": {"available": False, "reason": "Research data temporarily unavailable."},\n            "valuation_bands": {"available": False, "reason": "Research data temporarily unavailable."},\n            "error": str(exc),\n        }\n\n    _RESEARCH_CACHE[ticker] = (now, result)\n    return result\n\n\n@router.get("/{raw_ticker}")\ndef get_stock_research(raw_ticker: str):\n    return get_stock_research_payload(raw_ticker)\n'''
          text = replace_once(text, old_tail, new_tail, 'research context-aware helper')
          save('stock_research.py', text, crlf)

          # ---------- sec_fundamentals.py ----------
          text, crlf = load('sec_fundamentals.py')
          old_series = '''    normalized_response = sec_normalized_fundamentals(\n        ticker=ticker,\n        metrics=None,\n        limit=fundamentals_store.FUNDAMENTALS_SYNC_LIMIT,\n    )\n'''
          new_series = '''    raw_limit = min(\n        fundamentals_store.FUNDAMENTALS_SYNC_LIMIT,\n        max(200, limit * 4),\n    )\n    normalized_response = sec_normalized_fundamentals(\n        ticker=ticker,\n        metrics=metrics,\n        limit=raw_limit,\n    )\n'''
          text = replace_once(text, old_series, new_series, 'SEC requested-metric propagation')
          save('sec_fundamentals.py', text, crlf)

          # ---------- app.py ----------
          text, crlf = load('app.py')
          text = replace_once(
              text,
              'import threading\nfrom scipy.stats import norm\n',
              'import threading\nfrom concurrent.futures import ThreadPoolExecutor, TimeoutError as FuturesTimeoutError\nfrom scipy.stats import norm\n',
              'app executor import',
          )
          text = replace_once(
              text,
              '_CACHE_REFRESH_CONTEXT = threading.local()\n',
              '_CACHE_REFRESH_CONTEXT = threading.local()\n_RESEARCH_EXECUTOR = ThreadPoolExecutor(max_workers=2, thread_name_prefix="sethistock-research")\n',
              'app research executor',
          )
          text = replace_once(
              text,
              '        recent_hist = shared_hist.tail(5).copy() if shared_hist is not None and not shared_hist.empty else pd.DataFrame()\n\n        # 2. RUN THE FINVIZ SCRAPER TO FILL IN THE BLANKS\n',
              '''        recent_hist = shared_hist.tail(5).copy() if shared_hist is not None and not shared_hist.empty else pd.DataFrame()\n\n        # Reuse the already-fetched five-year price history for valuation/earnings research.\n        # This replaces the frontend's second five-year Yahoo download and lets the three\n        # supplementary financial charts arrive inside the main analysis payload.\n        research_future = None\n        try:\n            current_pe_hint = None\n            try:\n                raw_pe = (info or {}).get("trailingPE")\n                if raw_pe is not None:\n                    current_pe_hint = float(raw_pe)\n                    if not np.isfinite(current_pe_hint) or current_pe_hint <= 0:\n                        current_pe_hint = None\n            except Exception:\n                current_pe_hint = None\n            research_future = _RESEARCH_EXECUTOR.submit(\n                stock_research.get_stock_research_payload,\n                ticker,\n                yf.Ticker(ticker),\n                shared_hist.copy() if shared_hist is not None else pd.DataFrame(),\n                current_pe_hint,\n            )\n        except Exception:\n            research_future = None\n\n        # 2. RUN THE FINVIZ SCRAPER TO FILL IN THE BLANKS\n''',
              'app research future',
          )
          text = replace_once(
              text,
              '            "years": [], "revenue": [], "operating": [], "net": [], \n            "gross_margin": [], "op_margin": [], "net_margin": [],\n',
              '            "years": [], "revenue": [], "operating": [], "net": [], "ebitda": [],\n            "gross_margin": [], "op_margin": [], "net_margin": [],\n',
              'app EBITDA key',
          )
          text = replace_once(
              text,
              '''            gross = get_hist(fin, ['Gross Profit'])\n\n            fin_data["revenue"] = rev if rev else [0]*len(cols)\n            fin_data["operating"] = op_inc if op_inc else [0]*len(cols)\n            fin_data["net"] = net if net else [0]*len(cols)\n\n            fin_data["op_margin"] = [(o/r*100) if r else 0 for o, r in zip(fin_data["operating"], fin_data["revenue"])]\n''',
              '''            gross = get_hist(fin, ['Gross Profit'])\n            ebitda_hist = get_hist(fin, ['EBITDA', 'Normalized EBITDA'])\n            if not any(ebitda_hist or []):\n                da_hist = get_hist(cf, ['Depreciation And Amortization', 'Depreciation', 'Reconciled Depreciation'])\n                if da_hist and len(da_hist) == len(op_inc):\n                    ebitda_hist = [o + abs(d) if (o or d) else 0 for o, d in zip(op_inc, da_hist)]\n\n            fin_data["revenue"] = rev if rev else [0]*len(cols)\n            fin_data["operating"] = op_inc if op_inc else [0]*len(cols)\n            fin_data["net"] = net if net else [0]*len(cols)\n            fin_data["ebitda"] = ebitda_hist if ebitda_hist else [0]*len(cols)\n\n            fin_data["op_margin"] = [(o/r*100) if r else 0 for o, r in zip(fin_data["operating"], fin_data["revenue"])]\n''',
              'app EBITDA history',
          )
          text = replace_once(
              text,
              '            ebitda = fin_data["operating"][-1] if fin_data["operating"] and len(fin_data["operating"]) > 0 else 0\n',
              '            ebitda = fin_data["ebitda"][-1] if fin_data.get("ebitda") and fin_data["ebitda"][-1] > 0 else (fin_data["operating"][-1] if fin_data["operating"] else 0)\n',
              'app EV EBITDA fallback',
          )
          text = replace_once(
              text,
              '''        fallback_div_yield = "N/A"\n        try:\n            divs = stock.dividends\n            if divs is not None and not divs.empty:\n                recent_divs = divs[divs.index > (pd.Timestamp.now(tz=divs.index.tz) - pd.DateOffset(years=1))]\n                if not recent_divs.empty and current_price > 0:\n                    yield_pct = (recent_divs.sum() / current_price) * 100\n                    fallback_div_yield = f"{round(yield_pct, 2)}%"\n        except Exception:\n            pass\n\n        fallback_beta = "N/A"\n        try:\n            spy_hist = yf.Ticker("SPY").history(period="1y")\n            daily_hist = shared_hist.tail(260).copy() if shared_hist is not None and not shared_hist.empty else pd.DataFrame()\n            if not daily_hist.empty and not spy_hist.empty:\n                stock_rets = daily_hist['Close'].pct_change().dropna()\n                spy_rets = spy_hist['Close'].pct_change().dropna()\n                aligned = pd.concat([stock_rets, spy_rets], axis=1).dropna()\n                covar = np.cov(aligned.iloc[:,0], aligned.iloc[:,1])[0][1]\n                spy_var = np.var(aligned.iloc[:,1])\n                fallback_beta = round(covar / spy_var, 2) if spy_var > 0 else "N/A"\n        except Exception:\n            pass\n''',
              '''        fallback_div_yield = "N/A"\n        has_info_dividend = bool((info or {}).get("dividendYield") or (info or {}).get("trailingAnnualDividendYield"))\n        if not has_info_dividend:\n            try:\n                divs = stock.dividends\n                if divs is not None and not divs.empty:\n                    recent_divs = divs[divs.index > (pd.Timestamp.now(tz=divs.index.tz) - pd.DateOffset(years=1))]\n                    if not recent_divs.empty and current_price > 0:\n                        yield_pct = (recent_divs.sum() / current_price) * 100\n                        fallback_div_yield = f"{round(yield_pct, 2)}%"\n            except Exception:\n                pass\n\n        fallback_beta = "N/A"\n        if not (info and info.get("beta")):\n            try:\n                spy_hist = yf.Ticker("SPY").history(period="1y")\n                daily_hist = shared_hist.tail(260).copy() if shared_hist is not None and not shared_hist.empty else pd.DataFrame()\n                if not daily_hist.empty and not spy_hist.empty:\n                    stock_rets = daily_hist['Close'].pct_change().dropna()\n                    spy_rets = spy_hist['Close'].pct_change().dropna()\n                    aligned = pd.concat([stock_rets, spy_rets], axis=1).dropna()\n                    covar = np.cov(aligned.iloc[:,0], aligned.iloc[:,1])[0][1]\n                    spy_var = np.var(aligned.iloc[:,1])\n                    fallback_beta = round(covar / spy_var, 2) if spy_var > 0 else "N/A"\n            except Exception:\n                pass\n''',
              'app unnecessary fallback requests',
          )
          text = replace_once(
              text,
              '''        peers = ticker_peers.get(ticker.upper(), ['SPY', 'QQQ', 'DIA'])\n\n        result = {\n            "ticker": ticker.upper(), "current_price": round(current_price, 2),\n            "change": round(change, 2), "pct_change": round(pct_change, 2),\n            "shares": shares, "fcf": latest_fcf, "financials": fin_data, "stats": stats,\n            "insiders": insider_list, "peers": peers,\n            "summary": short_summary,\n            "dupont_analysis": dupont_metrics,            \n            "risk_profile": risk_metrics,                \n            "sensitivity_matrix": sensitivity_matrix     \n        }\n''',
              '''        peers = ticker_peers.get(ticker.upper(), ['SPY', 'QQQ', 'DIA'])\n\n        research_payload = {\n            "ticker": ticker.upper(),\n            "earnings_reaction": {"available": False},\n            "valuation_bands": {"available": False},\n        }\n        if research_future is not None:\n            try:\n                research_payload = research_future.result(timeout=2.5)\n            except FuturesTimeoutError:\n                pass\n            except Exception:\n                pass\n\n        chart_preview = {"dates": [], "opens": [], "highs": [], "lows": [], "closes": []}\n        try:\n            preview_hist = shared_hist.tail(260).copy() if shared_hist is not None and not shared_hist.empty else pd.DataFrame()\n            if not preview_hist.empty:\n                chart_preview = {\n                    "dates": preview_hist.index.strftime('%Y-%m-%d %H:%M:%S').tolist(),\n                    "opens": preview_hist['Open'].astype(float).tolist(),\n                    "highs": preview_hist['High'].astype(float).tolist(),\n                    "lows": preview_hist['Low'].astype(float).tolist(),\n                    "closes": preview_hist['Close'].astype(float).tolist(),\n                }\n        except Exception:\n            pass\n\n        result = {\n            "ticker": ticker.upper(), "current_price": round(current_price, 2),\n            "change": round(change, 2), "pct_change": round(pct_change, 2),\n            "shares": shares, "fcf": latest_fcf, "financials": fin_data, "stats": stats,\n            "insiders": insider_list, "peers": peers,\n            "summary": short_summary,\n            "research": research_payload,\n            "chart_preview": chart_preview,\n            "dupont_analysis": dupont_metrics,            \n            "risk_profile": risk_metrics,                \n            "sensitivity_matrix": sensitivity_matrix     \n        }\n''',
              'app initial research and chart payload',
          )
          save('app.py', text, crlf)
          PY
      - name: Validate Python
        run: |
          python -m py_compile app.py stock_research.py sec_fundamentals.py
          python - <<'PY'
          from pathlib import Path
          app = Path('app.py').read_text()
          research = Path('stock_research.py').read_text()
          sec = Path('sec_fundamentals.py').read_text()
          assert '"ebitda": []' in app
          assert '"research": research_payload' in app
          assert '"chart_preview": chart_preview' in app
          assert 'def get_stock_research_payload' in research
          assert 'metrics=metrics' in sec
          print('PHASE4A_FAST_INITIAL_BACKEND_OK')
          PY
      - name: Commit backend patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-phase4a-fast-initial-dashboard.yml
          git add app.py stock_research.py sec_fundamentals.py
          git commit -m 'Phase 4A: unify fast initial financial data'
          git push origin HEAD:phase4a-fast-initial-dashboard
