name: Phase 2.1 Attribution Patch

on:
  push:
    branches: [phase2-attribution]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2-attribution

      - name: Apply attribution backend patch
        run: python .github/scripts/phase2_attribution_patch.py

      - name: Install validation dependencies
        run: pip install -r requirements.txt

      - name: Validate backend attribution
        shell: bash
        run: |
          python -m py_compile sethiportfolio.py
          grep -q 'transaction_reconciled_pnl_attribution' sethiportfolio.py
          grep -q '/{slug}/attribution' sethiportfolio.py
          python - <<'PY'
          import pandas as pd
          import sethiportfolio as sp

          dates = pd.to_datetime(['2026-01-02', '2026-01-05', '2026-02-02'])
          fake = pd.DataFrame({'AAA': [10.0, 11.0, 12.0], 'BBB': [20.0, 20.0, 22.0]}, index=dates)
          original = sp._download_adjusted_close
          sp._download_adjusted_close = lambda symbols, start: fake.reindex(columns=symbols)
          try:
              portfolio = {'base_currency':'GBP','initial_capital':1000.0,'inception_date':'2026-01-02'}
              txns = [
                  {'id':'1','trade_date':'2026-01-02','side':'BUY','quantity':50,'price':10,'fees':0,'currency':'GBP','fx_rate_to_base':1,'instruments':{'symbol':'AAA','name':'Alpha','currency':'GBP'}},
                  {'id':'2','trade_date':'2026-01-05','side':'BUY','quantity':10,'price':20,'fees':0,'currency':'GBP','fx_rate_to_base':1,'instruments':{'symbol':'BBB','name':'Beta','currency':'GBP'}},
              ]
              out = sp._attribution_history(portfolio, txns)
              si = out['periods']['SI']
              assert abs(si['ending_nav'] - 1320.0) < 1e-6, si
              assert abs(si['total_pnl'] - 320.0) < 1e-6, si
              assert abs(si['component_contribution_pp'] - 32.0) < 1e-6, si
              assert abs(si['reconciliation_error']) < 1e-6, si
          finally:
              sp._download_adjusted_close = original
          print('Synthetic attribution reconciliation passed.')
          PY

      - name: Commit backend attribution
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Patch already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sethiportfolio.py
          git commit -m "Add transaction-aware performance attribution API"
          git push origin phase2-attribution
