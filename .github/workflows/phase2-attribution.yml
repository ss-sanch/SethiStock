      - uses: actions/checkout@v4
        with:
          ref: phase2-attribution

      - name: Add transaction-aware portfolio attribution API
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('sethiportfolio.py')
          text = path.read_text()

          anchor = '''    return {
