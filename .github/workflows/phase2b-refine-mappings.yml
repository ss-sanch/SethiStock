name: Phase 2B Mapping Refinement

on:
  push:
    branches:
      - phase2b-fundamentals-normalisation

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2b-fundamentals-normalisation

      - name: Apply mapping refinements
        run: python .phase2b_mapping_patch.py

      - name: Validate refined mappings
        run: |
          python -m py_compile fundamentals_normalizer.py
          python - <<'PY'
          import fundamentals_normalizer as fn

          def row(val, start=None, end='2024-12-31', filed='2025-02-01', form='10-K', fy=2024, fp='FY', accn='x'):
              out = {'val': val, 'end': end, 'filed': filed, 'form': form, 'fy': fy, 'fp': fp, 'accn': accn}
              if start is not None:
                  out['start'] = start
              return out

          def concept(unit, rows):
              return {'label': 'x', 'description': 'x', 'units': {unit: rows}}

          period = ('2024-01-01', '2024-12-31')
          # Alphabet-like fixture: no GrossProfit, but Revenue and CostOfRevenue exist.
          facts = {
              'facts': {
                  'us-gaap': {
                      'RevenueFromContractWithCustomerExcludingAssessedTax': concept('USD', [row(100, *period)]),
                      'CostOfRevenue': concept('USD', [row(60, *period)]),
                      'NetIncomeLoss': concept('USD', [row(20, *period)]),
                      'OperatingIncomeLoss': concept('USD', [row(30, *period)]),
                      'CommercialPaper': concept('USD', [row(4, end='2024-12-31')]),
                      'LongTermDebtCurrent': concept('USD', [row(2, end='2024-12-31')]),
                      'LongTermDebtNoncurrent': concept('USD', [row(10, end='2024-12-31')]),
                  }
              }
          }
          metrics = fn.build_normalized_fundamentals(facts, metrics=['gross_margin', 'debt'])
          gm = metrics['gross_margin']
          assert gm['count'] == 1, gm
          assert abs(gm['observations'][0]['value'] - 0.4) < 1e-12, gm
          numerator = gm['observations'][0]['components'][0]
          assert numerator['metric'] == 'gross_profit'
          debt = metrics['debt']
          assert debt['observations'][0]['value'] == 16, debt
          short = [x for x in debt['observations'][0]['components'] if x['metric'] == 'short_term']
          assert short and short[0]['concept'] == 'CommercialPaper', debt

          # If reported GrossProfit exists, it must win over the fallback.
          facts['facts']['us-gaap']['GrossProfit'] = concept('USD', [row(45, *period)])
          gm = fn.build_normalized_fundamentals(facts, metrics=['gross_margin'])['gross_margin']
          assert abs(gm['observations'][0]['value'] - 0.45) < 1e-12, gm
          assert gm['observations'][0]['components'][0]['concept'] == 'GrossProfit', gm
          print('PHASE2B_REFINED_MAPPING_OK')
          PY

      - name: Commit refined engine
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add fundamentals_normalizer.py
          git commit -m "Refine Phase 2B gross margin and debt mappings" || true
          git pull --rebase origin phase2b-fundamentals-normalisation
          git push
