name: Phase 1 Data Quality Hotfix

on:
  push:
    branches:
      - phase1-stability-hotfix

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-stability-hotfix
      - name: Apply data-quality patch
        run: python .phase1_data_quality_patch.py
      - name: Validate Python syntax and wiring
        run: |
          python -m py_compile app.py
          python - <<'PY'
          from pathlib import Path
          text = Path('app.py').read_text()
          required = [
              'def _analysis_cache_payload_valid',
              "numeric_close = pd.to_numeric(shared_hist['Close']",
              'result if np.isfinite(result)',
              'def _peer_dividend_yield_pct',
              'fallback_div_yield != "N/A"',
              'np.isfinite(sma_200)',
          ]
          for token in required:
              assert token in text, token
          print('STATIC_OK')
          PY
      - name: Install dependencies
        run: pip install -q -r requirements.txt
      - name: Test poisoned cache, chart and dividend-yield guards
        run: |
          python - <<'PY'
          import app

          poisoned = {
              'current_price': 0.0,
              'stats': {'div_yield': '73.0%', 'sma_200_pct': 'nan%', 'dist_52w_high': '-100.0%'}
          }
          healthy = {'current_price': 370.45, 'stats': {'sma_200_pct': '4.2%'}}
          assert app._analysis_cache_payload_valid(poisoned) is False
          assert app._analysis_cache_payload_valid(healthy) is True

          clean = app._sanitize_chart_payload({
              'dates': ['a','b','c'],
              'opens': [100,101,None],
              'highs': [102,103,None],
              'lows': [99,100,None],
              'closes': [101,102,None],
          })
          assert clean['closes'] == [101.0, 102.0], clean

          current_format = app._peer_dividend_yield_pct({'dividendYield': 0.73, 'trailingAnnualDividendYield': 0.0073})
          old_format = app._peer_dividend_yield_pct({'dividendYield': 0.0073, 'trailingAnnualDividendYield': 0.0073})
          assert abs(current_format - 0.73) < 1e-9, current_format
          assert abs(old_format - 0.73) < 1e-9, old_format
          print('DATA_QUALITY_OK')
          PY
      - name: Commit data-quality fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.py
          git commit -m "Reject poisoned stock cache and incomplete price rows"
          git pull --rebase origin phase1-stability-hotfix
          git push
