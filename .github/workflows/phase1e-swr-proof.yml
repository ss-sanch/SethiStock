name: Phase 1E Production SWR Proof

on:
  push:
    branches:
      - phase1e-production-smoke

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - name: Request stale AAPL analysis
        run: |
          python - <<'PY'
          import json, time, urllib.request
          base = 'https://sethistock-api.onrender.com'

          with urllib.request.urlopen(base + '/api/cache/status', timeout=60) as r:
              status = json.load(r)
          assert status.get('ready') is True, status
          assert status.get('stale_while_revalidate_seconds', {}).get('stock_analysis') == 86400, status

          started = time.perf_counter()
          with urllib.request.urlopen(base + '/api/stock/AAPL', timeout=120) as r:
              stock = json.load(r)
          elapsed = time.perf_counter() - started

          print('AAPL_STALE_RESPONSE_SECONDS=' + str(round(elapsed, 3)))
          print('AAPL_RESPONSE=' + json.dumps({
              'ticker': stock.get('ticker'),
              'current_price': stock.get('current_price'),
              'financial_years': len(stock.get('financials', {}).get('years', [])),
          }))
          assert stock.get('ticker') == 'AAPL', stock
          assert isinstance(stock.get('financials'), dict), stock
          assert elapsed < 12.0, f'Stale response took {elapsed:.3f}s; expected immediate cached return'
          PY
