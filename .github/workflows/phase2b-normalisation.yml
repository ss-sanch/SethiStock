name: Phase 2B Fundamentals Normalisation

on:
  push:
    branches:
      - phase2b-fundamentals-normalisation

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2b-fundamentals-normalisation

      - name: Apply route patch
        run: python .phase2b_route_patch.py

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Validate normalisation engine
        run: |
          python -m py_compile fundamentals_normalizer.py sec_fundamentals.py app.py
          python - <<'PY'
          from fastapi import FastAPI
          from fastapi.testclient import TestClient
          import fundamentals_normalizer as fn
          import sec_fundamentals as sec

          def row(val, start=None, end='2024-09-28', filed='2024-11-01', form='10-K', fy=2024, fp='FY', accn='a', frame=None):
              out = {'val': val, 'end': end, 'filed': filed, 'form': form, 'fy': fy, 'fp': fp, 'accn': accn}
              if start is not None:
                  out['start'] = start
              if frame is not None:
                  out['frame'] = frame
              return out

          def concept(label, unit, rows):
              return {'label': label, 'description': label, 'units': {unit: rows}}

          annual_2023 = ('2022-10-01', '2023-09-30')
          annual_2024 = ('2023-10-01', '2024-09-28')
          facts = {
              'entityName': 'Fixture Corp',
              'cik': 123456,
              'facts': {
                  'us-gaap': {
                      'RevenueFromContractWithCustomerExcludingAssessedTax': concept('Revenue', 'USD', [
                          row(100, *annual_2024, filed='2024-10-15', accn='old'),
                          row(105, *annual_2024, filed='2024-11-01', accn='new'),
                          row(999, *annual_2024, filed='2024-11-02', form='8-K', accn='bad'),
                      ]),
                      'SalesRevenueNet': concept('Legacy Revenue', 'USD', [
                          row(90, *annual_2023, filed='2023-11-01', fy=2023, accn='legacy23'),
                          row(95, *annual_2024, filed='2024-11-01', accn='legacy24'),
                      ]),
                      'NetIncomeLoss': concept('Net Income', 'USD', [row(25, *annual_2024)]),
                      'NetCashProvidedByUsedInOperatingActivities': concept('OCF', 'USD', [row(40, *annual_2024)]),
                      'PaymentsToAcquirePropertyPlantAndEquipment': concept('CapEx', 'USD', [row(10, *annual_2024)]),
                      'CashAndCashEquivalentsAtCarryingValue': concept('Cash', 'USD', [row(20, end='2024-09-28')]),
                      'GrossProfit': concept('Gross Profit', 'USD', [row(42, *annual_2024)]),
                      'OperatingIncomeLoss': concept('Operating Income', 'USD', [row(30, *annual_2024)]),
                      'LongTermDebtCurrent': concept('Current LTD', 'USD', [row(2, end='2024-09-28')]),
                      'LongTermDebtNoncurrent': concept('Noncurrent LTD', 'USD', [row(8, end='2024-09-28')]),
                      'ShortTermBorrowings': concept('Short Borrowings', 'USD', [row(1, end='2024-09-28')]),
                  },
                  'dei': {
                      'EntityCommonStockSharesOutstanding': concept('Shares', 'shares', [row(5, end='2024-09-28')]),
                  },
              },
          }

          metrics = fn.build_normalized_fundamentals(facts, limit=250)
          assert list(metrics) == fn.NORMALIZED_METRIC_ORDER

          revenue = metrics['revenue']
          assert revenue['count'] == 2, revenue
          assert revenue['observations'][0]['value'] == 90
          assert revenue['observations'][1]['value'] == 105
          assert revenue['observations'][1]['concept'] == 'RevenueFromContractWithCustomerExcludingAssessedTax'
          assert revenue['observations'][1]['accn'] == 'new'
          assert set(revenue['coverage']['concepts_used']) == {
              'us-gaap:RevenueFromContractWithCustomerExcludingAssessedTax',
              'us-gaap:SalesRevenueNet',
          }

          assert metrics['free_cash_flow']['observations'][-1]['value'] == 30
          assert metrics['debt']['observations'][-1]['value'] == 11
          assert metrics['shares']['observations'][-1]['value'] == 5
          assert abs(metrics['gross_margin']['observations'][-1]['value'] - (42 / 105)) < 1e-12
          assert abs(metrics['operating_margin']['observations'][-1]['value'] - (30 / 105)) < 1e-12
          assert abs(metrics['net_margin']['observations'][-1]['value'] - (25 / 105)) < 1e-12
          assert metrics['free_cash_flow']['observations'][-1]['components'][0]['metric'] == 'operating_cash_flow'
          assert metrics['gross_margin']['observations'][-1]['derived'] is True
          assert metrics['revenue']['observations'][-1]['duration_days'] is not None

          schema = fn.get_normalization_schema()
          assert schema['schema_version'] == '2b-v1'
          assert schema['period_classification'] == 'deferred_to_phase_2d'
          assert schema['metrics'] == fn.NORMALIZED_METRIC_ORDER

          app = FastAPI()
          app.include_router(sec.router)
          sec.get_company_facts = lambda ticker: (
              {'ticker': ticker.upper(), 'cik': 123456, 'cik_padded': '0000123456', 'title': 'Fixture Corp'},
              facts,
          )
          client = TestClient(app)
          response = client.get('/api/sec/FIX/fundamentals/normalized?metrics=revenue,free_cash_flow,net_margin&limit=25')
          assert response.status_code == 200, response.text
          payload = response.json()
          assert payload['schema_version'] == '2b-v1'
          assert payload['metric_order'] == ['revenue', 'free_cash_flow', 'net_margin']
          assert set(payload['metrics']) == {'revenue', 'free_cash_flow', 'net_margin'}
          assert payload['period_classification'] == 'deferred_to_phase_2d'

          bad = client.get('/api/sec/FIX/fundamentals/normalized?metrics=made_up_metric')
          assert bad.status_code == 400, bad.text
          schema_response = client.get('/api/sec/normalization/schema')
          assert schema_response.status_code == 200
          assert schema_response.json()['schema_version'] == '2b-v1'
          print('PHASE2B_NORMALISATION_OK')
          PY

      - name: Commit real Phase 2B changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add fundamentals_normalizer.py sec_fundamentals.py
          git commit -m "Wire Phase 2B normalized fundamentals API" || true
          git pull --rebase origin phase2b-fundamentals-normalisation
          git push
