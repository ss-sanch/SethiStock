name: Patch foreign funding FX
on:
  push:
    branches: [feature/sethiportfolio-foreign-funding-fx]
    paths:
      - 'scripts/patch_foreign_funding_fx.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sethiportfolio-foreign-funding-fx
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/patch_foreign_funding_fx.py
      - run: python -m py_compile sethiportfolio.py
      - name: Commit patched backend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sethiportfolio.py
          git diff --cached --quiet && exit 0
          git commit -m "Support foreign-currency allocation funding [skip ci]"
          git push
