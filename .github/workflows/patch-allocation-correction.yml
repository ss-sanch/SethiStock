name: Patch allocation correction
on:
  push:
    branches: [feature/sethiportfolio-allocation-correction]
    paths:
      - scripts/patch_allocation_correction.py
      - .github/workflows/patch-allocation-correction.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sethiportfolio-allocation-correction
      - run: python scripts/patch_allocation_correction.py
      - run: python -m py_compile sethiportfolio.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sethiportfolio.py
          git diff --cached --quiet && exit 0
          git commit -m "Add audit-preserving allocation date corrections [skip ci]"
          git push origin HEAD:feature/sethiportfolio-allocation-correction
