name: Phase 1D Cache Validation

on:
  push:
    branches:
      - phase1d-supabase-cache

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1d-supabase-cache

      - name: Apply Phase 1D patch
        run: python .phase1d_patch.py

      - name: Validate Python syntax and wiring
        run: |
          python -m py_compile app.py
          python - <<'PY'
          from pathlib import Path
          text = Path('app.py').read_text(encoding='utf-8')
          required = [
              'def _cache_lookup(namespace: str, identity: str):',
              'def _cache_write(namespace: str, identity: str, payload, ttl_seconds: int, ticker=None):',
              '@app.get("/api/cache/status")',
              '_cache_get_fresh("stock_analysis", ticker)',
              '_cache_write("stock_analysis", ticker, result, CACHE_TTL_STOCK, ticker=ticker)',
              '_cache_get_fresh("quote", ticker)',
              '_cache_write("quote", ticker, result, CACHE_TTL_QUOTE, ticker=ticker)',
              '_cache_get_fresh("peer_snapshots", cache_identity)',
          ]
          for token in required:
              assert token in text, token
          print('Phase 1D cache wiring found.')
          PY

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test cache helpers and cache-hit fast path
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_KEY: test-service-role-key
          ADMIN_SECRET: test
        run: |
          python - <<'PY'
          from datetime import datetime, timezone, timedelta
          import app

          class FakeResponse:
              def __init__(self, status_code=200, payload=None):
                  self.status_code = status_code
                  self._payload = payload if payload is not None else []
              def json(self):
                  return self._payload

          future = (datetime.now(timezone.utc) + timedelta(hours=1)).isoformat()
          original_get = app.requests.get
          original_post = app.requests.post
          try:
              app.requests.get = lambda *args, **kwargs: FakeResponse(200, [{
                  'payload': {'ticker': 'AAPL'},
                  'cached_at': datetime.now(timezone.utc).isoformat(),
                  'expires_at': future,
              }])
              entry = app._cache_lookup('ticker_resolution', 'AAPL')
              assert entry and entry['fresh'] is True
              assert app._cache_get_fresh('ticker_resolution', 'AAPL') == {'ticker': 'AAPL'}
              assert app._cache_json_safe(float('nan')) is None

              captured = {}
              def fake_post(*args, **kwargs):
                  captured['json'] = kwargs.get('json')
                  return FakeResponse(201, [])
              app.requests.post = fake_post
              assert app._cache_write('quote', 'AAPL', {'price': 123.0}, 300, ticker='AAPL') is True
              assert captured['json']['cache_key'].startswith('v1:quote:AAPL')
              assert captured['json']['ticker'] == 'AAPL'

              cached_analysis = {
                  'ticker': 'AAPL',
                  'current_price': 100.0,
                  'change': 0.0,
                  'pct_change': 0.0,
                  'stats': {'mkt_cap': '$1.00T'},
              }
              app._resolve_ticker_cached = lambda raw: 'AAPL'
              app._cache_get_fresh = lambda namespace, identity: cached_analysis if namespace == 'stock_analysis' else None
              app.get_stock_quote = lambda raw: {
                  'ticker': 'AAPL', 'current_price': 125.0, 'change': 2.0,
                  'pct_change': 1.63, 'market_cap': '$2.00T', 'peers': []
              }
              result = app.get_stock_data('AAPL')
              assert result['current_price'] == 125.0
              assert result['change'] == 2.0
              assert result['stats']['mkt_cap'] == '$2.00T'
              assert cached_analysis['current_price'] == 100.0, 'cached object should not be mutated in place'
              print('Cache helper and stock cache-hit tests passed.')
          finally:
              app.requests.get = original_get
              app.requests.post = original_post
          PY

      - name: Commit Phase 1D backend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet && exit 0
          git commit -m "Add persistent Supabase cache for SethiStock"
          git push
