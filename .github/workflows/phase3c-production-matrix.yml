name: Phase 3C Production Matrix

on:
  push:
    branches: [phase3c-production-matrix]

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - name: Validate all flagship drivers serially
        run: |
          python - <<'PY'
          import json, time, urllib.request, urllib.error, http.client

          base='https://sethistock-api.onrender.com/api/drivers'
          cases=[
            {'ticker':'AAPL','metric':'services_revenue','filings':3,'kind':'inline','dimension':'servicemember'},
            {'ticker':'MSFT','metric':'intelligent_cloud_revenue','filings':4,'kind':'inline','dimension':'intelligentcloudmember'},
            {'ticker':'GOOGL','metric':'google_search_revenue','filings':3,'kind':'inline','dimension':'googlesearchothermember'},
            {'ticker':'AMZN','metric':'aws_revenue','filings':3,'kind':'inline','dimension':'amazonwebservices'},
            {'ticker':'META','metric':'reality_labs_revenue','filings':3,'kind':'inline','dimension':'realitylabs'},
            {'ticker':'NVDA','metric':'data_center_revenue','filings':4,'kind':'inline','dimension':'datacenter'},
            {'ticker':'TSLA','metric':'automotive_revenue','filings':3,'kind':'inline','dimension':'automotivesegment'},
            {'ticker':'NFLX','metric':'paid_memberships','filings':16,'kind':'table'},
            {'ticker':'JPM','metric':'cet1_ratio','filings':3,'kind':'table'},
            {'ticker':'V','metric':'processed_transactions','filings':3,'kind':'table'},
          ]

          def get(path, timeout=420, attempts=4):
              last=None
              for attempt in range(1, attempts+1):
                  try:
                      req=urllib.request.Request(base+path, headers={'User-Agent':'SethiStock Phase3C production proof'})
                      with urllib.request.urlopen(req, timeout=timeout) as r:
                          return json.load(r)
                  except (urllib.error.URLError, urllib.error.HTTPError, TimeoutError, http.client.RemoteDisconnected, ConnectionResetError) as exc:
                      last=repr(exc)
                      if attempt==attempts:
                          break
                      wait=12*attempt
                      print('RETRY',path,'attempt',attempt,'after',last,'sleep',wait,flush=True)
                      time.sleep(wait)
              raise AssertionError(('request_failed',path,last))

          results=[]
          for case in cases:
              ticker=case['ticker']; metric=case['metric']; filings=case['filings']
              cov=get(f'/{ticker}/coverage', timeout=120)
              assert cov.get('history_version')=='3c-history-v1', (ticker,cov)
              target=next(row for row in cov['metrics'] if row['key']==metric)
              assert target.get('verified') is True, (ticker,target)

              history=get(f'/{ticker}/history/{metric}?filings={filings}&period=quarterly&limit=40')
              assert history.get('verified') is True, (ticker,metric,history)
              assert history.get('data_state')=='verified_history', (ticker,metric,history)
              assert history.get('observation_count',0)>=1, (ticker,metric,history)
              rows=history['observations']
              dates=[str(row.get('end') or row.get('instant') or '') for row in rows]
              assert dates==sorted(dates) and len(dates)==len(set(dates)) and all(dates), (ticker,dates)
              for row in rows:
                  assert row.get('value') is not None, (ticker,metric,row)
                  assert row.get('filing_date'), (ticker,metric,row)
                  assert row.get('accession'), (ticker,metric,row)
                  assert (row.get('source_url') or '').startswith('https://www.sec.gov/Archives/edgar/data/'), (ticker,metric,row)

              latest=rows[-1]
              if case['kind']=='inline':
                  assert float(latest['value'])>0, (ticker,metric,latest)
                  dim=' '.join(str(x) for x in latest.get('dimensions') or []).lower().replace('_','').replace('-','')
                  expected=case['dimension'].lower()
                  assert expected in ''.join(ch for ch in dim if ch.isalnum() or ch==':'), (ticker,metric,latest)
                  assert latest.get('extraction_method') in {'sec_inline_xbrl_verified_rule','derived_q4_fy_minus_9m'}, (ticker,metric,latest)
              else:
                  assert history.get('source_mode')=='sec_filing_table', (ticker,metric,history)
                  assert 'filing_table' in str(latest.get('extraction_method') or ''), (ticker,metric,latest)
                  assert float(latest['value'])>0, (ticker,metric,latest)

              extra={}
              if ticker=='NVDA':
                  d=get('/NVDA/history/gross_margin?filings=4&period=quarterly&limit=12')
                  assert d.get('verified') and d.get('observation_count',0)>=1, d
                  v=float(d['observations'][-1]['value'])
                  assert 0 < v < 100, d['observations'][-1]
                  assert d['observations'][-1].get('extraction_method')=='derived_ratio_from_sec_facts'
                  extra['gross_margin']=v
              if ticker=='TSLA':
                  d=get('/TSLA/history/automotive_gross_margin?filings=3&period=quarterly&limit=12')
                  assert d.get('verified') and d.get('observation_count',0)>=1, d
                  v=float(d['observations'][-1]['value'])
                  assert 0 < v < 100, d['observations'][-1]
                  assert d['observations'][-1].get('extraction_method')=='derived_ratio_from_sec_facts'
                  extra['automotive_gross_margin']=v

              summary={
                  'ticker':ticker,'metric':metric,'coverage_state':target.get('state'),
                  'observation_count':history['observation_count'],'coverage':history.get('coverage'),
                  'latest_period':dates[-1],'latest_value':latest['value'],'source_mode':history.get('source_mode','inline_xbrl'),
                  **extra,
              }
              results.append(summary)
              print('PHASE3C_FLAGSHIP_OK',json.dumps(summary,separators=(',',':')),flush=True)
              time.sleep(4)

          assert len(results)==10
          print('PHASE3C_FINAL_PRODUCTION_OK')
          print(json.dumps(results,indent=2))
          PY
