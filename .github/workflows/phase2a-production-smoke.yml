name: Phase 2A Production Smoke

on:
  push:
    branches:
      - phase2a-production-smoke

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Render deploy and verify SEC foundation
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          base = 'https://sethistock-api.onrender.com'

          def get(path, timeout=90):
              try:
                  with urllib.request.urlopen(base + path, timeout=timeout) as response:
                      return response.status, json.load(response)
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode('utf-8', errors='replace')
                  try:
                      payload = json.loads(body)
                  except Exception:
                      payload = {'raw': body[:1000]}
                  return exc.code, payload

          deadline = time.time() + 300
          last = None
          while time.time() < deadline:
              try:
                  status, payload = get('/api/sec/AAPL/overview', 90)
                  last = (status, payload)
                  if status == 200:
                      break
                  if status == 502:
                      print('SEC_BACKEND_502=' + json.dumps(payload, sort_keys=True))
                      raise SystemExit(2)
                  print('WAITING=' + str(status) + ':' + json.dumps(payload, sort_keys=True)[:500])
              except SystemExit:
                  raise
              except Exception as exc:
                  print('WAIT_ERROR=' + repr(exc))
              time.sleep(10)
          else:
              raise AssertionError(f'Phase 2A route not healthy before timeout: {last}')

          assert payload.get('ticker') == 'AAPL', payload
          assert payload.get('cik') == 320193, payload
          taxonomies = payload.get('taxonomies') or []
          us_gaap = next((item for item in taxonomies if item.get('taxonomy') == 'us-gaap'), None)
          assert us_gaap and us_gaap.get('concept_count', 0) > 100, us_gaap
          print('AAPL_OVERVIEW=' + json.dumps({
              'entity': payload.get('entity_name'),
              'cik': payload.get('cik'),
              'us_gaap_concepts': us_gaap.get('concept_count'),
              'us_gaap_facts': us_gaap.get('fact_count'),
          }, sort_keys=True))

          query = urllib.parse.urlencode({'q': 'revenue', 'limit': 25})
          status, concepts = get('/api/sec/AAPL/concepts?' + query)
          assert status == 200, (status, concepts)
          assert concepts.get('count', 0) > 0, concepts
          print('REVENUE_CONCEPT_MATCHES=' + str(concepts.get('count')))
          print('REVENUE_CONCEPTS=' + json.dumps([
              item.get('concept') for item in (concepts.get('concepts') or [])[:8]
          ]))

          query = urllib.parse.urlencode({'concept': 'Assets', 'limit': 5})
          status, assets = get('/api/sec/AAPL/concept?' + query)
          assert status == 200, (status, assets)
          usd = (assets.get('units') or {}).get('USD') or []
          assert usd and all(row.get('val') is not None for row in usd), assets
          print('ASSET_ROWS=' + str(len(usd)))
          print('LATEST_ASSET_FACT=' + json.dumps(usd[0], sort_keys=True))

          for ticker, cik in [('MSFT', 789019), ('GOOGL', 1652044)]:
              status, company = get(f'/api/sec/{ticker}/overview')
              assert status == 200, (ticker, status, company)
              assert company.get('cik') == cik, company
              assert any(item.get('taxonomy') == 'us-gaap' for item in company.get('taxonomies') or []), company
              print(f'{ticker}_SEC_OK=' + str(company.get('cik_padded')))

          print('PHASE2A_PRODUCTION_OK')
          PY
