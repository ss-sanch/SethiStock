name: Phase 3.1 Thesis Tracking API

on:
  push:
    branches: [phase3-thesis-api]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase3-thesis-api
      - name: Apply thesis API patch
        run: python .github/scripts/phase3_thesis_api_patch.py
      - name: Validate backend
        run: |
          python -m py_compile sethiportfolio.py
          grep -q 'def get_theses' sethiportfolio.py
          grep -q 'def create_thesis_update' sethiportfolio.py
          grep -q 'effective_conviction' sethiportfolio.py
          grep -q 'portfolio_thesis_updates' sethiportfolio.py
          test -f sql/sethiportfolio_3a_thesis_tracking.sql
      - name: Commit thesis API
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Patch already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sethiportfolio.py
          git commit -m "Add structured thesis tracking API"
          git push origin HEAD:phase3-thesis-api
