name: Patch USD GBP FX reference
on:
  push:
    branches: [fix/sethiportfolio-usd-gbp-fx-reference]
    paths:
      - 'scripts/patch_usd_gbp_fx_reference.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sethiportfolio-usd-gbp-fx-reference
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/patch_usd_gbp_fx_reference.py
      - run: python -m py_compile sethiportfolio.py
      - name: Commit patched backend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sethiportfolio.py
          git diff --cached --quiet && exit 0
          git commit -m "Use canonical Yahoo USD GBP FX series [skip ci]"
          git push
