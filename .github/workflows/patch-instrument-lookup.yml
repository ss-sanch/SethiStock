name: Patch instrument lookup
on:
  push:
    branches: [feature/sethiportfolio-instrument-lookup]
    paths:
      - scripts/patch_instrument_lookup.py
      - .github/workflows/patch-instrument-lookup.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sethiportfolio-instrument-lookup
      - run: python scripts/patch_instrument_lookup.py
      - run: python -m py_compile sethiportfolio.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sethiportfolio.py
          git diff --cached --quiet && exit 0
          git commit -m "Add SethiPortfolio instrument verification and reference pricing [skip ci]"
          git push origin HEAD:feature/sethiportfolio-instrument-lookup
