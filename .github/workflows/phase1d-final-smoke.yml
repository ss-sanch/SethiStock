name: Phase 1D Final Smoke

on:
  push:
    branches:
      - phase1d-final-smoke

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Hit production cache endpoints twice
        run: |
          python - <<'PY'
          import json, time, urllib.request
          base = 'https://sethistock-api.onrender.com'

          def get(path):
              with urllib.request.urlopen(base + path, timeout=120) as r:
                  return json.load(r)

          status = get('/api/cache/status')
          print('STATUS=' + json.dumps(status, sort_keys=True))
          assert status.get('configured') is True, status
          assert status.get('ready') is True, status

          for i in range(2):
              quote = get('/api/quote/AAPL')
              chart = get('/api/chart/AAPL?period=1mo&interval=1d')
              stock = get('/api/stock/AAPL')
              print(f'ITERATION={i+1}')
              print('QUOTE=' + json.dumps({k: quote.get(k) for k in ['ticker','current_price','change','pct_change','market_cap']}))
              print('CHART_POINTS=' + str(len(chart.get('closes', []))))
              print('STOCK=' + json.dumps({'ticker': stock.get('ticker'), 'current_price': stock.get('current_price')}))
              assert quote.get('ticker') == 'AAPL'
              assert len(chart.get('closes', [])) > 0
              assert stock.get('ticker') == 'AAPL'
              time.sleep(2)
          PY
