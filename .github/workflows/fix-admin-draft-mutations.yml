name: Fix admin draft mutations
on:
  push:
    branches: [fix/sethiportfolio-admin-draft-mutations]
    paths:
      - scripts/fix_admin_draft_mutations.py
      - .github/workflows/fix-admin-draft-mutations.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sethiportfolio-admin-draft-mutations
      - run: python scripts/fix_admin_draft_mutations.py
      - run: python -m py_compile sethiportfolio.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sethiportfolio.py
          git diff --cached --quiet && exit 0
          git commit -m "Fix admin draft edit and delete lookups [skip ci]"
          git push origin HEAD:fix/sethiportfolio-admin-draft-mutations
