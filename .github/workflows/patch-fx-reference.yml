name: Patch FX reference
on:
  push:
    branches: [feature/sethiportfolio-fx-reference]
    paths:
      - scripts/patch_fx_reference.py
      - .github/workflows/patch-fx-reference.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sethiportfolio-fx-reference
      - run: python scripts/patch_fx_reference.py
      - run: python -m py_compile sethiportfolio.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sethiportfolio.py
          git diff --cached --quiet && exit 0
          git commit -m "Add historical FX reference to instrument lookup [skip ci]"
          git push origin HEAD:feature/sethiportfolio-fx-reference
