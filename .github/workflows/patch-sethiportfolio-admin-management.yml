name: Patch SethiPortfolio Admin Management
on:
  push:
    branches:
      - feature/sethiportfolio-admin-management
    paths:
      - scripts/patch_sethiportfolio_admin_management.py
      - .github/workflows/patch-sethiportfolio-admin-management.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sethiportfolio-admin-management
      - run: python scripts/patch_sethiportfolio_admin_management.py
      - run: |
          python -m py_compile sethiportfolio.py
          python - <<'PY'
          from pathlib import Path
          s=Path('sethiportfolio.py').read_text(encoding='utf-8')
          for route in [
              '/admin/{slug}/journal/{journal_id}',
              '/admin/{slug}/transaction/{transaction_id}/correct',
              '/admin/{slug}/journal',
          ]:
              assert route in s
          assert '_supabase_patch' in s and '_supabase_delete' in s and '_supabase_post_many' in s
          print('Phase 2E backend validation passed')
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sethiportfolio.py
          git diff --cached --quiet && exit 0
          git commit -m "Add SethiPortfolio journal management and trade corrections [skip ci]"
          git push origin HEAD:feature/sethiportfolio-admin-management
