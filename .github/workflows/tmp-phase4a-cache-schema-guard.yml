name: Temporary Phase 4A stock cache schema guard
on:
  push:
    paths:
      - '.github/workflows/tmp-phase4a-cache-schema-guard.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase4a-fast-initial-dashboard
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require the new initial-dashboard fields in cached stock analyses
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          raw = p.read_bytes()
          crlf = b'\r\n' in raw
          text = raw.decode().replace('\r\n','\n')
          old = '''    stats = payload.get("stats")\n    if isinstance(stats, dict):\n        for value in stats.values():\n            if isinstance(value, str) and ("nan" in value.lower() or "inf" in value.lower()):\n                return False\n    return True\n'''
          new = '''    stats = payload.get("stats")\n    if isinstance(stats, dict):\n        for value in stats.values():\n            if isinstance(value, str) and ("nan" in value.lower() or "inf" in value.lower()):\n                return False\n\n    # Phase 4A initial-dashboard payload contract. Old six-hour analysis cache rows\n    # predate these fields; treating them as invalid refreshes only stock_analysis\n    # while preserving the independent quote/chart/ticker caches.\n    financials = payload.get("financials")\n    research = payload.get("research")\n    chart_preview = payload.get("chart_preview")\n    if not isinstance(financials, dict) or not isinstance(financials.get("ebitda"), list):\n        return False\n    if not isinstance(research, dict) or "valuation_bands" not in research or "earnings_reaction" not in research:\n        return False\n    if not isinstance(chart_preview, dict) or not isinstance(chart_preview.get("closes"), list):\n        return False\n    return True\n'''
          if text.count(old) != 1:
              raise SystemExit(f'cache validator block matches={text.count(old)}')
          text = text.replace(old,new,1)
          if crlf:
              text = text.replace('\n','\r\n')
          p.write_bytes(text.encode())
          PY
      - name: Validate patch
        run: |
          python -m py_compile app.py
          python - <<'PY'
          import ast
          from pathlib import Path
          text = Path('app.py').read_text()
          assert 'Phase 4A initial-dashboard payload contract' in text
          assert '"valuation_bands" not in research' in text
          assert 'chart_preview.get("closes")' in text
          ast.parse(text)
          print('PHASE4A_CACHE_SCHEMA_GUARD_OK')
          PY
      - name: Commit application change and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-phase4a-cache-schema-guard.yml
          git add app.py
          git commit -m 'Phase 4A: invalidate legacy analysis cache payloads'
          git push origin HEAD:phase4a-fast-initial-dashboard
