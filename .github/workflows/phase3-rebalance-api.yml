name: Phase 3.3 Rebalance Simulator API

on:
  push:
    branches: [phase3-rebalance-api]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase3-rebalance-api
      - name: Apply rebalance simulator patch
        run: python .github/scripts/phase3_rebalance_api_patch.py
      - name: Validate backend syntax and structure
        run: |
          python -m py_compile sethiportfolio.py
          python - <<'PY'
          from pathlib import Path
          import ast
          text = Path('sethiportfolio.py').read_text()
          tree = ast.parse(text)
          assert sum(isinstance(n, ast.ClassDef) and n.name == 'PortfolioRebalancePayload' for n in tree.body) == 1
          assert sum(isinstance(n, ast.FunctionDef) and n.name == '_portfolio_rebalance_simulation' for n in tree.body) == 1
          assert sum(isinstance(n, ast.FunctionDef) and n.name == 'simulate_rebalance' for n in tree.body) == 1
          assert text.count('/rebalance-simulator') == 1
          print('Rebalance API structure validated')
          PY
      - name: Commit rebalance simulator API
        run: |
          if git diff --quiet; then
            echo 'Patch already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sethiportfolio.py
          git commit -m 'Add portfolio rebalance what-if simulator API'
          git push origin HEAD:phase3-rebalance-api
